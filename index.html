<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>财富环游记 · 梦想岛</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;background:#51bde5;color:#fff;overflow:hidden}.hero{min-height:100vh;position:relative;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 70%,#d7f2a0 0 12%,#86d47a 13% 25%,transparent 26%),linear-gradient(180deg,#70d0f2 0 52%,#249bc9 52%)}.cloud{position:absolute;background:#fff9;border-radius:50px;filter:blur(.2px)}.c1{width:190px;height:55px;top:9%;left:6%}.c2{width:240px;height:65px;top:14%;right:5%}.island{position:absolute;width:min(900px,88vw);height:42vh;bottom:-10vh;left:50%;transform:translateX(-50%);background:radial-gradient(ellipse,#b8e28c 0 50%,#65b95e 51% 67%,#f4d38a 68% 72%,transparent 73%);filter:drop-shadow(0 25px 18px #07527455)}.trees{position:absolute;bottom:14%;left:0;right:0;text-align:center;font-size:clamp(34px,5vw,75px);letter-spacing:2vw;filter:drop-shadow(0 8px 4px #1645)}.content{position:relative;z-index:3;text-align:center;max-width:760px;margin-top:-8vh}.logo{display:inline-block;background:linear-gradient(#ffe66c,#f4a82c);color:#22405a;border:7px solid #fff1a8;border-radius:36px;padding:16px 30px;box-shadow:0 10px 0 #a96524,0 20px 35px #17445d66;transform:rotate(-2deg);text-shadow:0 2px #fff}.logo h1{font-size:clamp(38px,7vw,78px);line-height:.95;margin:0;letter-spacing:-3px}.logo b{font-size:clamp(15px,2vw,25px);letter-spacing:5px}.map{margin:30px auto 8px;font-size:clamp(24px,4vw,44px);font-weight:1000;text-shadow:0 4px 0 #226087}.sub{font-size:18px;font-weight:800;text-shadow:0 2px 3px #24536d;margin-bottom:24px}.characters{font-size:clamp(45px,7vw,82px);margin:10px;filter:drop-shadow(0 8px 4px #17465c66)}.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.play,.secondary{border:0;border-radius:20px;padding:15px 32px;font-weight:1000;font-size:19px;cursor:pointer;transition:.18s}.play{background:linear-gradient(#ff7a62,#ef4d3e);color:#fff;border:4px solid #ffd39c;box-shadow:0 7px 0 #a4362e,0 12px 20px #17445d55}.play:hover{transform:translateY(-3px)}.secondary{background:#174c72dd;color:#fff;border:2px solid #9bdcf5}.footer{position:absolute;z-index:3;bottom:14px;font-size:11px;color:#e9f8ff;opacity:.85}.badge{position:absolute;top:18px;right:18px;background:#174c72cc;border:2px solid #a8e5f7;border-radius:99px;padding:8px 14px;font-size:12px;font-weight:800}.modal{position:fixed;inset:0;background:#082e4bc9;z-index:10;display:none;place-items:center}.modal.show{display:grid}.dialog{width:min(520px,90vw);background:#fff5d8;color:#24415a;border:5px solid #f1bd48;border-radius:24px;padding:22px;text-align:left;box-shadow:0 25px 60px #0018}.dialog h2{text-align:center}.dialog button{display:block;margin:15px auto 0;border:0;background:#ef5b48;color:white;padding:10px 22px;border-radius:12px;font-weight:900;cursor:pointer}@media(max-width:600px){.hero{padding:12px}.content{margin-top:-5vh}.logo{padding:12px 18px;border-width:5px}.sub{font-size:14px}.trees{bottom:18%}.play,.secondary{padding:12px 20px;font-size:16px}}</style></head><body><main class="hero"><div class="cloud c1"></div><div class="cloud c2"></div><div class="badge">RICHMAN WORLD · V4</div><div class="island"></div><div class="trees">🌴 🏠 🌳 ⛲ 🏨 🌲 🎡 🌴</div><section class="content"><div class="logo"><h1>财富环游记</h1><b>RICH MAN</b></div><div class="map">🏝️ 梦想岛 · DREAM ISLAND</div><div class="sub">建造你的梦想 · 运用卡片与策略 · 成为梦想岛首富</div><div class="characters">🧸 🐰 🐱 🦖</div><div class="buttons"><button class="play" onclick="location.href='./world.html'">🌍 进入世界</button><button class="secondary" onclick="continueGame()">▶ 继续游戏</button><button class="secondary" onclick="rules()">📖 游戏规则</button></div></section><div class="footer">RICHMAN WORLD · Original web board game prototype</div></main><div id="modal" class="modal"><div class="dialog"><h2>📖 梦想岛规则</h2><p>掷骰子环游梦想岛，购买地产并升级建筑，向经过你地产的玩家收取过路费。</p><p>使用遥控骰子、免租、建设、停留、均分、抢夺和好运等卡片改变局势；踩中幸运转盘可以抽取新卡。</p><p>医院、监狱和大学会带来特殊的三回合状态。现金跌破 0 即破产，最后存活的玩家成为梦想岛首富。</p><button onclick="document.getElementById('modal').classList.remove('show')">明白了</button></div></div><script>function rules(){document.getElementById('modal').classList.add('show')}function continueGame(){location.href='./world.html'}</script></body></html>
