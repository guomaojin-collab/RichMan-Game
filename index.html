<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>财富环游记 · 梦想岛</title><style>:root{--navy:#123a61;--gold:#ffbd3e;--coral:#ff6854;--sky:#69c8ef;--cream:#fff6d9}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'PingFang SC',sans-serif;color:#17324d;background:linear-gradient(#65c8ef 0 43%,#2d9dc9 43% 100%);min-height:100vh;overflow-x:hidden}.game{max-width:1440px;margin:auto;padding:14px}.top{display:grid;grid-template-columns:210px repeat(4,1fr);gap:10px;align-items:center}.logo{background:linear-gradient(#ffdc62,#ef9d24);border:5px solid #fff0b2;border-radius:28px;padding:10px;text-align:center;box-shadow:0 7px 0 #9d5b20,0 12px 25px #15435a55;transform:rotate(-2deg)}.logo b{font-size:26px;text-shadow:0 2px white}.logo small{display:block;font-weight:900}.pbox{background:#173e63;color:white;border:3px solid #8ad3f4;border-radius:16px;padding:8px 12px;display:grid;grid-template-columns:42px 1fr;gap:8px;box-shadow:0 6px 14px #17415c55}.pbox.active{outline:4px solid #fff1a0;transform:translateY(3px)}.pbox .face{font-size:31px}.pbox strong{font-size:17px}.pbox .cash{font-size:19px;font-weight:900;color:#ffe16a}.world{margin-top:14px;display:grid;grid-template-columns:240px 1fr 260px;gap:12px;align-items:end}.panel{background:#123b60eF;color:white;border:2px solid #75c6e8;border-radius:18px;padding:13px;box-shadow:0 10px 25px #06344b66}.panel h3{margin:0 0 9px;color:#fff}.boardShell{background:radial-gradient(circle,#d8f1ad 0 34%,#9bd475 35% 49%,#5fb8dd 50%);border-radius:44% 44% 32% 32%;padding:25px;box-shadow:0 20px 30px #07507588;min-height:680px}.board{height:630px;display:grid;grid-template:repeat(7,1fr)/repeat(7,1fr);gap:6px;position:relative}.tile{position:relative;border:3px solid #fff9df;border-radius:12px;padding:5px;background:linear-gradient(#fff8cc,#f6cf58);box-shadow:0 6px 0 #8c7136,0 8px 10px #264c4b44;font-size:10px;text-align:center;overflow:visible}.tile.event{background:linear-gradient(#bfeeff,#62bde6)}.tile.tax{background:linear-gradient(#e7edff,#9eb9e7)}.tile.start{background:linear-gradient(#fff,#ffcdb9)}.tile.shop{background:linear-gradient(#d9ffc8,#79cc78)}.tile .em{font-size:24px}.tile .nm{font-weight:900}.tile .lv{font-size:9px;color:#7a4b18}.tile.o0{outline:4px solid #ff6b75}.tile.o1{outline:4px solid #5dbaff}.tile.o2{outline:4px solid #ffc746}.tile.o3{outline:4px solid #62cc77}.tokens{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);display:flex}.pawn{font-size:27px;filter:drop-shadow(0 3px 2px #3337);margin-left:-7px}.center{grid-area:2/2/7/7;border-radius:45%;background:radial-gradient(circle,#f8e7b6,#9bd77e 55%,#65b8d5);border:4px solid #e9f6cb;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 0 40px #30784c55}.fountain{font-size:70px;filter:drop-shadow(0 7px 5px #3557)}.turn{background:#153f65e8;color:white;padding:10px 28px;border-radius:18px;border:2px solid #8bcbe8}.turn b{color:#ffe269}.dice{font-size:72px;line-height:1.1;filter:drop-shadow(0 6px 4px #3336)}button{font:inherit;cursor:pointer}.roll{border:4px solid #ffd58b;background:linear-gradient(#ff785d,#ef4b3c);color:white;border-radius:22px;padding:13px 38px;font-size:22px;font-weight:900;box-shadow:0 7px 0 #a6362d}.roll:disabled{filter:grayscale(1);opacity:.55}.actions{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;justify-content:center}.mini{border:2px solid #ffe59a;background:#173e63;color:white;border-radius:12px;padding:8px 12px;font-weight:800}.primary{background:#ffb934;color:#382b14;border:2px solid #fff1a5}.log{height:190px;overflow:auto;font-size:12px}.log div{padding:6px;border-bottom:1px solid #ffffff22}.cardItem{background:#fff;color:#24415b;border-radius:10px;padding:8px;margin:6px 0;display:flex;justify-content:space-between}.stock{display:grid;grid-template-columns:1fr auto auto;gap:6px;font-size:12px;padding:7px 0;border-bottom:1px solid #ffffff22}.up{color:#79f19a}.down{color:#ff9b92}.modal{position:fixed;inset:0;background:#092d47aa;display:none;place-items:center;z-index:20}.modal.show{display:grid}.dialog{width:min(440px,90vw);background:#fff7dd;border:5px solid #f4c14e;border-radius:24px;padding:20px;text-align:center;box-shadow:0 20px 50px #0019}.dialog .big{font-size:58px}.dialog button{border:0;border-radius:12px;padding:10px 18px;margin:5px;font-weight:900}.bottomNav{display:flex;gap:8px;margin-top:10px}.bottomNav button{flex:1;background:#123b60;color:#fff;border:2px solid #73bfdf;border-radius:13px;padding:10px;font-weight:800}@media(max-width:1050px){.top{grid-template-columns:1fr 1fr}.logo{grid-column:1/-1}.world{grid-template-columns:1fr}.boardShell{order:-1}.board{height:600px}.sideL,.sideR{display:grid;grid-template-columns:1fr 1fr;gap:10px}}@media(max-width:600px){.game{padding:6px}.top{gap:5px}.pbox{padding:5px;font-size:10px}.pbox .face{font-size:22px}.pbox strong,.pbox .cash{font-size:12px}.boardShell{padding:10px;min-height:480px;border-radius:24px}.board{height:470px;gap:3px}.tile{padding:2px;border-width:1px;font-size:7px}.tile .em{font-size:14px}.pawn{font-size:17px}.center{padding:5px}.fountain{font-size:38px}.dice{font-size:45px}.roll{font-size:16px;padding:9px 20px}.sideL,.sideR{display:block}.panel{margin:7px 0}}</style></head><body><div class="game"><div class="top"><div class="logo"><b>💰财富环游记</b><small>RICH MAN · DREAM ISLAND</small></div><div id="topPlayers" style="display:contents"></div></div><div class="world"><div class="sideL"><section class="panel"><h3>🃏 我的卡片</h3><div id="cards"></div></section><section class="panel"><h3>📈 梦想股票</h3><div id="stocks"></div><div class="actions"><button class="mini" onclick="trade('buy')">买入</button><button class="mini" onclick="trade('sell')">卖出</button></div></section></div><main class="boardShell"><div id="board" class="board"><div class="center"><div class="fountain">⛲</div><div class="turn"><b id="turnName">P1 小熊</b> 的回合<br><span id="hint">点击骰子开始！</span></div><div id="dice" class="dice">⚀</div><button id="roll" class="roll">🎲 掷骰子</button><div class="actions"><button class="mini" onclick="useCard('remote')">🎯 遥控骰子</button><button class="mini" onclick="useCard('bonus')">💰 奖金卡</button></div></div></div></main><div class="sideR"><section class="panel"><h3>🏠 地产情报</h3><div id="info">移动到地产后查看详情。</div><div id="propertyActions" class="actions"></div></section><section class="panel"><h3>📜 游戏日志</h3><div id="log" class="log"></div></section><div class="bottomNav"><button onclick="showAssets()">💼 资产</button><button onclick="showHelp()">❔ 规则</button><button onclick="restart()">↻ 重开</button></div></div></div></div><div id="modal" class="modal"><div class="dialog"><div id="modalIcon" class="big">🎁</div><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalBtns"></div></div></div><script>
const faces=['🧸','🐰','🐱','🦖'],names=['小熊','兔兔','咪咪','Dino'],diceFaces=['⚀','⚁','⚂','⚃','⚄','⚅'];
const base=[['GO 起点','🏁','start',0],['阳光咖啡馆','☕','land',200],['机会','❓','event',0],['星空公寓','🏠','land',220],['税务局','🧾','tax',120],['美食街','🍜','land',260],['游乐园','🎡','land',300],['卡片商店','🃏','shop',0],['森林小屋','🌲','land',320],['海滨别墅','🌊','land',350],['幸运日','🍀','event',0],['科技公司','💻','land',390],['银行街','🏦','land',430],['购物中心','🛍️','land',460],['新闻事件','📰','event',0],['艺术广场','🎨','land',490],['所得税','💸','tax',180],['摩天大楼','🏙️','land',530],['黄金海岸','🌅','land',580],['卡片商店','🃏','shop',0],['豪华酒店','🏨','land',650],['命运','🔮','event',0],['中央广场','⛲','land',700],['梦想之巅','👑','land',780]];
const pos=[];for(let c=6;c>=0;c--)pos.push([6,c]);for(let r=5;r>=0;r--)pos.push([r,0]);for(let c=1;c<=6;c++)pos.push([0,c]);for(let r=1;r<=5;r++)pos.push([r,6]);let tiles,players,turn,busy,pending,forced=null;let stocks=[{n:'星河科技',p:102},{n:'甜甜餐饮',p:78},{n:'蓝海旅行',p:125}];
function init(){tiles=base.map((x,i)=>({n:x[0],e:x[1],t:x[2],price:x[3],owner:null,lv:0,id:i}));players=names.map((n,i)=>({n,face:faces[i],cash:1500,pos:0,alive:true,props:[],cards:{remote:1,bonus:1},shares:[0,0,0]}));turn=0;busy=false;pending=null;forced=null;document.getElementById('log').innerHTML='';log('🌴 欢迎来到梦想岛！每位玩家获得 ¥1,500。');render()}
function rent(t){return Math.round(t.price*(.2+t.lv*.16))}function upgradeCost(t){return Math.round(t.price*(.55+t.lv*.15))}function log(s){let d=document.createElement('div');d.textContent=s;document.getElementById('log').prepend(d)}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function render(){document.querySelectorAll('.tile').forEach(x=>x.remove());tiles.forEach((t,i)=>{let d=document.createElement('div');d.className='tile '+t.t+(t.owner!==null?' o'+t.owner:'');d.style.gridRow=pos[i][0]+1;d.style.gridColumn=pos[i][1]+1;d.innerHTML=`<div class="em">${t.e}</div><div class="nm">${t.n}</div>${t.price?`<div>¥${t.price}</div>`:''}${t.lv?`<div class="lv">${'🏠'.repeat(t.lv)} Lv.${t.lv}</div>`:''}<div class="tokens">${players.map(p=>p.alive&&p.pos===i?`<span class="pawn">${p.face}</span>`:'').join('')}</div>`;document.getElementById('board').appendChild(d)});document.getElementById('topPlayers').innerHTML=players.map((p,i)=>`<div class="pbox ${i===turn?'active':''}" style="opacity:${p.alive?1:.45}"><div class="face">${p.face}</div><div><strong>P${i+1} ${p.n}</strong><div class="cash">¥ ${p.cash}</div><small>地产 ${p.props.length} · 卡片 ${p.cards.remote+p.cards.bonus}</small></div></div>`).join('');let p=players[turn],t=tiles[p.pos];document.getElementById('turnName').textContent=`P${turn+1} ${p.n}`;document.getElementById('cards').innerHTML=`<div class="cardItem"><span>🎯 遥控骰子</span><b>×${p.cards.remote}</b></div><div class="cardItem"><span>💰 奖金卡</span><b>×${p.cards.bonus}</b></div>`;document.getElementById('stocks').innerHTML=stocks.map((s,i)=>`<div class="stock"><b>${s.n}</b><span class="${s.delta>=0?'up':'down'}">¥${s.p}</span><span>持${p.shares[i]}</span></div>`).join('');document.getElementById('info').innerHTML=t.t==='land'?`<b>${t.e} ${t.n}</b><br>地价 ¥${t.price}<br>等级 Lv.${t.lv}<br>当前租金 ¥${rent(t)}<br>${t.owner===null?'✨ 无人拥有':`业主：${players[t.owner].n}`}`:`当前位置：${t.e} ${t.n}`;document.getElementById('propertyActions').innerHTML=t.owner===turn&&t.lv<3?`<button class="mini primary" onclick="upgrade()">🏗️ 升级 ¥${upgradeCost(t)}</button>`:''}
function next(){if(checkEnd())return;do{turn=(turn+1)%players.length}while(!players[turn].alive);stocks.forEach(s=>{let old=s.p;s.p=Math.max(20,Math.round(s.p*(.92+Math.random()*.17)));s.delta=s.p-old});busy=false;document.getElementById('roll').disabled=false;document.getElementById('hint').textContent='点击骰子开始！';render()}
document.getElementById('roll').onclick=async()=>{if(busy)return;busy=true;document.getElementById('roll').disabled=true;let n=forced||Math.floor(Math.random()*6)+1;forced=null;for(let i=0;i<8;i++){document.getElementById('dice').textContent=diceFaces[Math.floor(Math.random()*6)];await sleep(60)}document.getElementById('dice').textContent=diceFaces[n-1];log(`🎲 ${players[turn].n} 掷出 ${n}`);let p=players[turn];for(let i=0;i<n;i++){let old=p.pos;p.pos=(p.pos+1)%tiles.length;if(p.pos<old){p.cash+=300;log('🏁 经过起点，领取 ¥300')};render();await sleep(150)}resolveTile()};
function resolveTile(){let p=players[turn],t=tiles[p.pos];if(t.t==='land'){if(t.owner===null){pending=t;popup(t.e,t.n,`售价 ¥${t.price}。购买后可以继续升级建筑。`,[{txt:'购买',fn:buy},{txt:'跳过',fn:()=>{close();next()}}]);return}else if(t.owner!==turn){let r=rent(t);p.cash-=r;players[t.owner].cash+=r;log(`🏠 ${p.n} 向 ${players[t.owner].n} 支付租金 ¥${r}`)}}else if(t.t==='tax'){p.cash-=t.price;log(`🧾 ${p.n} 缴税 ¥${t.price}`)}else if(t.t==='shop'){let type=Math.random()>.5?'remote':'bonus';p.cards[type]++;log(`🃏 ${p.n} 获得一张${type==='remote'?'遥控骰子':'奖金卡'}`);popup('🃏','卡片商店','免费获得一张神秘功能卡！',[{txt:'收下',fn:()=>{close();next()}}]);return}else if(t.t==='event'){event();return}bankrupt();next()}
function event(){let p=players[turn];let es=[['🎁','旅行达人','完成梦想旅行，获得 ¥260',260],['🌧️','暴雨维修','房屋维修支出 ¥180',-180],['📈','市场大涨','投资收益 ¥320',320],['🎫','幸运抽奖','中了大奖 ¥500',500],['📱','意外开销','电子设备损坏 -¥150',-150]];let e=es[Math.floor(Math.random()*es.length)];p.cash+=e[3];log(`${e[0]} ${p.n}：${e[2]}`);popup(e[0],e[1],e[2],[{txt:'知道了',fn:()=>{close();bankrupt();next()}}])}
function buy(){let p=players[turn];if(pending&&p.cash>=pending.price){p.cash-=pending.price;pending.owner=turn;pending.lv=1;p.props.push(pending.id);log(`🏡 ${p.n} 买下 ${pending.n}`)}else log('💸 现金不足');pending=null;close();bankrupt();next()}
function upgrade(){if(busy)return;let p=players[turn],t=tiles[p.pos],c=upgradeCost(t);if(t.owner===turn&&t.lv<3&&p.cash>=c){p.cash-=c;t.lv++;log(`🏗️ ${p.n} 将 ${t.n} 升到 Lv.${t.lv}`);render()}else popup('💸','无法升级','现金不足或建筑已满级。',[{txt:'好的',fn:close}])}
function useCard(type){if(busy)return;let p=players[turn];if(!p.cards[type]){popup('🃏','没有卡片','你目前没有这张卡。',[{txt:'好的',fn:close}]);return}if(type==='bonus'){p.cards.bonus--;p.cash+=250;log(`💰 ${p.n} 使用奖金卡 +¥250`);render()}else{let n=prompt('遥控骰子：请输入 1-6');n=Number(n);if(n>=1&&n<=6){p.cards.remote--;forced=n;log(`🎯 ${p.n} 设置骰子为 ${n}`);render()}}}
function trade(mode){if(busy)return;let p=players[turn],i=0,s=stocks[i];if(mode==='buy'){if(p.cash>=s.p){p.cash-=s.p;p.shares[i]++;log(`📈 买入 ${s.n} 1股`)}else log('💸 现金不足')}else if(p.shares[i]){p.shares[i]--;p.cash+=s.p;log(`📉 卖出 ${s.n} 1股`)}render()}
function bankrupt(){let p=players[turn];if(p.cash<0){p.alive=false;p.props.forEach(id=>{tiles[id].owner=null;tiles[id].lv=0});p.props=[];log(`💥 ${p.n} 破产退出梦想岛！`)}}
function checkEnd(){let a=players.filter(p=>p.alive);if(a.length===1){popup('🏆','梦想岛首富',`${a[0].face} ${a[0].n} 获得最终胜利！`,[{txt:'再来一局',fn:()=>{close();init()}}]);document.getElementById('roll').disabled=true;return true}return false}
function popup(ic,title,text,btns){document.getElementById('modalIcon').textContent=ic;document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text;let b=document.getElementById('modalBtns');b.innerHTML='';btns.forEach(x=>{let el=document.createElement('button');el.textContent=x.txt;el.onclick=x.fn;b.appendChild(el)});document.getElementById('modal').classList.add('show')}function close(){document.getElementById('modal').classList.remove('show')}function showAssets(){let p=players[turn],stock=p.shares.reduce((a,n,i)=>a+n*stocks[i].p,0),land=p.props.reduce((a,id)=>a+tiles[id].price*(1+tiles[id].lv*.5),0);popup('💼',p.n+' 的总资产',`现金 ¥${p.cash} · 地产估值 ¥${Math.round(land)} · 股票 ¥${stock} · 总资产 ¥${Math.round(p.cash+land+stock)}`,[{txt:'关闭',fn:close}])}function showHelp(){popup('📖','梦想岛规则','掷骰前进，购买并升级地产收取更高租金。利用卡片与股票扩大财富；现金跌破 0 即破产，最后存活的玩家获胜。',[{txt:'明白',fn:close}])}function restart(){if(confirm('重新开始梦想岛？'))init()}init();
</script></body></html>
