<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>财富环游记 RichMan</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'PingFang SC',sans-serif;background:linear-gradient(135deg,#f7ecd4,#dcebd9);color:#25251f;min-height:100vh}.app{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}h1{margin:0;font-size:42px}header p{margin:3px 0;color:#70685b}.tag{background:#222;color:#fff;padding:8px 14px;border-radius:20px}.layout{display:grid;grid-template-columns:1fr 310px;gap:18px}.boardbox{background:#fffaf0;border:2px solid #292923;border-radius:24px;padding:10px;box-shadow:0 15px 40px #4b3b241c;aspect-ratio:1}.board{height:100%;display:grid;grid-template:repeat(7,1fr)/repeat(7,1fr);gap:6px}.tile{position:relative;border:1.5px solid #333;border-radius:9px;background:#fff;padding:5px;font-size:10px;box-shadow:2px 2px #333;overflow:hidden}.tile.event,.tile.tax,.tile.start{background:#fff0bb}.tile.o0{background:#ffe0dc}.tile.o1{background:#dcecff}.tile.o2{background:#dcf3e4}.tile.o3{background:#f1e0ff}.emoji{font-size:18px}.name{font-weight:800}.price{opacity:.6}.tokens{position:absolute;right:2px;bottom:2px;display:flex}.token{width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid #222;display:grid;place-items:center;font-size:10px}.center{grid-area:2/2/7/7;border:2px dashed #aaa08d;border-radius:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:25px;background:#f8f1e4}.center h2{font-size:30px;margin:5px}.dice{font-size:58px}.roll{background:#222;color:#fff;border:0;border-radius:14px;padding:13px 25px;font-size:17px;font-weight:800;box-shadow:0 5px #000;cursor:pointer}.roll:disabled{opacity:.4}.side{display:flex;flex-direction:column;gap:12px}.card{background:#fffaf1;border:1.5px solid #333;border-radius:18px;padding:15px;box-shadow:0 10px 30px #4b3b2415}.card h3{margin:0 0 10px}.player{display:grid;grid-template-columns:32px 1fr auto;gap:7px;align-items:center;padding:9px;border-radius:12px;background:#eee7da;margin:6px 0;border:2px solid transparent}.player.active{background:#fff;border-color:#222}.money{font-weight:900}.small{font-size:11px;color:#746c60}.log{height:180px;overflow:auto;font-size:12px}.log div{border-bottom:1px dashed #ddd;padding:6px 0}.buy{width:100%;border:0;border-radius:12px;padding:11px;background:#e84d3d;color:#fff;font-weight:800;cursor:pointer;margin-top:8px}.buy.alt{background:#777}.hidden{display:none}.reset{width:100%;border:1px solid #aaa;background:transparent;border-radius:10px;padding:8px;cursor:pointer}@media(max-width:850px){.layout{grid-template-columns:1fr}.boardbox{min-height:580px}.side{display:grid;grid-template-columns:1fr 1fr}.logcard{grid-column:1/-1}}@media(max-width:560px){.app{padding:10px}h1{font-size:29px}.tag{display:none}.boardbox{min-height:470px}.tile{padding:2px;font-size:7px}.emoji{font-size:13px}.center{padding:8px}.center h2{font-size:20px}.center p{font-size:11px}.side{display:block}.card{margin-top:10px}}</style></head><body><div class="app"><header><div><h1>💰 财富环游记</h1><p>掷骰子 · 买地产 · 收租金 · 成为最后的富豪</p></div><span class="tag">RICHMAN · V1</span></header><div class="layout"><div class="boardbox"><div id="board" class="board"><div class="center"><div style="font-size:45px">🏙️</div><h2 id="turnTitle">玩家 1 的回合</h2><p id="hint">点击骰子开始你的财富之旅。</p><div id="dice" class="dice">⚀</div><button id="roll" class="roll">🎲 掷骰子</button><div id="decision" class="hidden"><button id="buy" class="buy">购买地产</button><button id="skip" class="buy alt">暂时不买</button></div></div></div></div><aside class="side"><div class="card"><h3>👥 玩家资产</h3><div id="players"></div></div><div class="card"><h3>🏠 当前地产</h3><div id="property" class="small">落在可购买地产后会显示信息。</div></div><div class="card logcard"><h3>📜 财富动态</h3><div id="log" class="log"></div><button class="reset" onclick="restart()">重新开始游戏</button></div></aside></div></div><script>
const icons=['🚗','🚀','🐼','🦊'], dice=['⚀','⚁','⚂','⚃','⚄','⚅'];
const raw=[['起点','🏁','start',0],['咖啡街','☕','land',180],['幸运卡','🎁','event',0],['樱花公寓','🌸','land',220],['税务局','🧾','tax',120],['海滨大道','🌊','land',260],['科技园','💻','land',300],['机会','✨','event',0],['音乐广场','🎵','land',320],['美食街','🍜','land',350],['度假村','🏝️','land',390],['奖金日','💎','event',0],['金融中心','🏦','land',430],['购物天堂','🛍️','land',460],['税务局','🧾','tax',180],['艺术街区','🎨','land',490],['好运降临','🍀','event',0],['摩天大楼','🏙️','land',530],['黄金海岸','🌅','land',580],['奢华酒店','🏨','land',650],['命运卡','🔮','event',0],['中央广场','⛲','land',700],['钻石大道','💎','land',760],['财富之巅','👑','land',850]];
let tiles,players,turn,busy,pending;
const positions=[];for(let c=6;c>=0;c--)positions.push([6,c]);for(let r=5;r>=0;r--)positions.push([r,0]);for(let c=1;c<=6;c++)positions.push([0,c]);for(let r=1;r<=5;r++)positions.push([r,6]);
function init(){tiles=raw.map((x,i)=>({name:x[0],emoji:x[1],type:x[2],price:x[3],owner:null,id:i}));players=icons.map((icon,i)=>({name:'玩家 '+(i+1),icon,money:2000,pos:0,alive:true,props:[]}));turn=0;busy=false;pending=null;document.getElementById('log').innerHTML='';log('🎉 游戏开始！每位玩家拥有 ¥2,000。');render();}
function render(){document.querySelectorAll('.tile').forEach(e=>e.remove());tiles.forEach((t,i)=>{let d=document.createElement('div');d.className='tile '+t.type+(t.owner!==null?' o'+t.owner:'');d.style.gridRow=positions[i][0]+1;d.style.gridColumn=positions[i][1]+1;d.innerHTML=`<div class="emoji">${t.emoji}</div><div class="name">${t.name}</div>${t.price?`<div class="price">¥${t.price}</div>`:''}<div class="tokens">${players.map((p,j)=>p.alive&&p.pos===i?`<span class="token">${p.icon}</span>`:'').join('')}</div>`;document.getElementById('board').appendChild(d)});document.getElementById('players').innerHTML=players.map((p,i)=>`<div class="player ${i===turn&&p.alive?'active':''}" style="opacity:${p.alive?1:.4}"><div style="font-size:22px">${p.icon}</div><div><b>${p.name}</b><div class="small">地产 ${p.props.length} · ${p.alive?'游戏中':'已破产'}</div></div><div class="money">¥${p.money}</div></div>`).join('');document.getElementById('turnTitle').textContent=players[turn].name+' 的回合';let t=tiles[players[turn].pos];document.getElementById('property').innerHTML=t.type==='land'?`<b>${t.emoji} ${t.name}</b><br>售价 ¥${t.price}<br>租金 ¥${rent(t)}<br>${t.owner===null?'尚未被购买':'属于 '+players[t.owner].name}`:'当前位置：'+t.emoji+' '+t.name;}
function rent(t){return Math.floor(t.price*.28)}function log(s){let d=document.createElement('div');d.textContent=s;document.getElementById('log').prepend(d)}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
document.getElementById('roll').onclick=async()=>{if(busy)return;busy=true;document.getElementById('roll').disabled=true;let n=Math.floor(Math.random()*6)+1;for(let i=0;i<8;i++){document.getElementById('dice').textContent=dice[Math.floor(Math.random()*6)];await sleep(70)}document.getElementById('dice').textContent=dice[n-1];log(`${players[turn].icon} ${players[turn].name} 掷出了 ${n}`);let p=players[turn];for(let i=0;i<n;i++){let old=p.pos;p.pos=(p.pos+1)%tiles.length;if(p.pos<old){p.money+=300;log('🏁 经过起点，获得 ¥300');}render();await sleep(180)}await land();};
async function land(){let p=players[turn],t=tiles[p.pos];if(t.type==='land'){if(t.owner===null){pending=t;document.getElementById('hint').textContent=`${t.name} 售价 ¥${t.price}，要购买吗？`;document.getElementById('decision').classList.remove('hidden');if(p.money<t.price)finish();return}else if(t.owner!==turn&&players[t.owner].alive){let r=rent(t);p.money-=r;players[t.owner].money+=r;log(`🏠 向 ${players[t.owner].name} 支付 ${t.name} 租金 ¥${r}`)}}else if(t.type==='tax'){p.money-=t.price;log(`🧾 缴纳费用 ¥${t.price}`)}else if(t.type==='event'){let events=[['获得项目奖金',300],['旅行超支',-180],['投资收益',250],['手机摔坏了',-120],['朋友请客',150],['股票波动',-220]];let e=events[Math.floor(Math.random()*events.length)];p.money+=e[1];log(`${t.emoji} ${e[0]} ${e[1]>0?'+':''}¥${e[1]}`)}checkBankrupt();finish();}
document.getElementById('buy').onclick=()=>{let p=players[turn];if(pending&&p.money>=pending.price){p.money-=pending.price;pending.owner=turn;p.props.push(pending.id);log(`🏡 ${p.name} 买下了 ${pending.name}，花费 ¥${pending.price}`)}else log('💸 资金不足，无法购买');closeDecision();checkBankrupt();finish()};document.getElementById('skip').onclick=()=>{log('👋 放弃购买 '+pending.name);closeDecision();finish()};function closeDecision(){pending=null;document.getElementById('decision').classList.add('hidden')}
function checkBankrupt(){let p=players[turn];if(p.money<0){p.alive=false;p.props.forEach(id=>tiles[id].owner=null);p.props=[];log(`💥 ${p.name} 破产退出！`)}let alive=players.filter(x=>x.alive);if(alive.length===1){render();document.getElementById('hint').textContent=`🏆 ${alive[0].name} 成为最终富豪！`;document.getElementById('roll').disabled=true;busy=true;return true}return false}function finish(){if(checkBankrupt())return;do{turn=(turn+1)%players.length}while(!players[turn].alive);busy=false;document.getElementById('roll').disabled=false;document.getElementById('hint').textContent='点击骰子继续财富之旅。';render()}function restart(){if(confirm('确定重新开始游戏吗？'))init()}init();
</script></body></html>
