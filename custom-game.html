<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RichMan World · 玩家世界试玩</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'PingFang SC',sans-serif;background:linear-gradient(#79d4f3,#2798c5);color:#173b58;min-height:100vh}.app{max-width:1150px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;color:white}.board{height:680px;position:relative;margin-top:15px;background:radial-gradient(circle,#dff2ad 0 38%,#95d173 39% 64%,#5cb8da 65%);border:6px solid #e9faff;border-radius:40px;box-shadow:0 15px 0 #237fa5}.route{position:absolute;inset:12%;border:34px solid #f3e0b2;border-radius:43%;box-shadow:inset 0 0 0 4px #c8ac75}.node{position:absolute;width:62px;height:62px;border-radius:50%;transform:translate(-50%,-50%);background:#fff0a0;border:4px solid white;box-shadow:0 5px #98722d;display:grid;place-items:center;text-align:center;font-size:9px;font-weight:900}.node.special{background:#ffb7a9}.node.event{background:#a9e8ff}.node.shop{background:#b9ef9e}.pawn{position:absolute;transform:translate(-50%,-90%);font-size:34px;z-index:8;transition:left .2s,top .2s}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#174c73e8;color:white;border:3px solid #8edcf5;border-radius:22px;padding:14px 22px;text-align:center}.dice{font-size:58px}.btn{border:0;border-radius:13px;padding:10px 17px;font-weight:900;cursor:pointer;background:#ef5948;color:white}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.p{background:#164c73;color:white;border:2px solid #8bd9f5;border-radius:15px;padding:9px}.p.on{outline:4px solid #ffe274}.money{color:#ffe36e;font-weight:900}.log{position:absolute;right:15px;bottom:15px;width:230px;max-height:130px;overflow:auto;background:#123c60e8;color:white;border-radius:15px;padding:9px;font-size:11px}.back{color:white;font-weight:900;text-decoration:none}@media(max-width:650px){.board{height:520px}.node{width:47px;height:47px}.pawn{font-size:24px}.hud{grid-template-columns:1fr 1fr}.log{width:180px}}</style></head><body><div class="app"><header class="top"><div><h1 id="title">玩家世界</h1><small>UGC WORLD PLAYTEST</small></div><a class="back" href="./builder.html">← 编辑器</a></header><div id="hud" class="hud"></div><main id="board" class="board"><div class="route"></div><div class="center"><b id="turn"></b><div id="dice" class="dice">⚀</div><button id="roll" class="btn">🎲 掷骰子</button></div><div id="log" class="log"></div></main></div><script>const defs={start:['🏁','起点'],land:['🏠','地产'],event:['❓','机会'],shop:['🎁','转盘'],hospital:['🏥','医院'],university:['🎓','大学'],jail:['🚔','监狱'],tax:['🧾','税务']},faces=['🧸','🐰','🐱','🦖'],df=['⚀','⚁','⚂','⚃','⚄','⚅'];let map=JSON.parse(localStorage.getItem('richman_custom_map')||'null');if(!map){location.href='./builder.html'}let ps=Array.from({length:map.maxPlayers},(_,i)=>({face:faces[i],name:'P'+(i+1),cash:map.cash,pos:0,type:i?'ai':'human',skip:0})),turn=0,busy=false;title.textContent='🗺️ '+map.name;function xy(i){let a=Math.PI*2*i/map.route.length+Math.PI/2;return[50+39*Math.cos(a),50+37*Math.sin(a)]}function note(x){let d=document.createElement('div');d.textContent=x;log.prepend(d)}function render(){board.querySelectorAll('.node,.pawn').forEach(x=>x.remove());map.route.forEach((t,i)=>{let [x,y]=xy(i),v=defs[t],d=document.createElement('div');d.className='node '+(t==='event'?'event':t==='shop'?'shop':['hospital','university','jail'].includes(t)?'special':'');d.style.left=x+'%';d.style.top=y+'%';d.innerHTML='<div><b>'+v[0]+'</b><br>'+v[1]+'</div>';board.appendChild(d)});ps.forEach((p,i)=>{let[x,y]=xy(p.pos),d=document.createElement('div');d.className='pawn';d.style.left=(x+(i-1.5))+'%';d.style.top=(y+(i%2))+'%';d.textContent=p.face;board.appendChild(d)});hud.innerHTML=ps.map((p,i)=>'<div class="p '+(i===turn?'on':'')+'"><b>'+p.face+' '+p.name+' '+(p.type==='ai'?'🤖':'👤')+'</b><div class="money">¥'+p.cash+'</div></div>').join('');document.getElementById('turn').textContent=ps[turn].face+' '+ps[turn].name+' 的回合';roll.disabled=busy||ps[turn].type==='ai'}function next(){turn=(turn+1)%ps.length;busy=false;render();if(ps[turn].skip){ps[turn].skip--;note(ps[turn].name+' 暂停一回合');setTimeout(next,700);return}if(ps[turn].type==='ai')setTimeout(()=>roll.click(),700)}roll.onclick=async()=>{if(busy)return;busy=true;let n=Math.floor(Math.random()*6)+1;for(let i=0;i<7;i++){dice.textContent=df[Math.floor(Math.random()*6)];await new Promise(r=>setTimeout(r,55))}dice.textContent=df[n-1];let p=ps[turn];note('🎲 '+p.name+' 掷出 '+n);for(let i=0;i<n;i++){let old=p.pos;p.pos=(p.pos+1)%map.route.length;if(p.pos<old){p.cash+=300;note('🏁 '+p.name+' +¥300')}render();await new Promise(r=>setTimeout(r,160))}resolve()};function resolve(){let p=ps[turn],t=map.route[p.pos];if(t==='land'){let delta=Math.round(80+Math.random()*140);p.cash-=delta;note('🏠 地产体验费用 -¥'+delta)}else if(t==='event'){let g=Math.random()>.5?200:-120;p.cash+=g;note('❓ 机会事件 '+(g>0?'+':'')+'¥'+g)}else if(t==='shop'){p.cash+=100;note('🎁 幸运奖励 +¥100')}else if(t==='hospital'){p.skip=1;note('🏥 '+p.name+' 休息 1 回合')}else if(t==='university'){p.cash+=120;note('🎓 学习奖励 +¥120')}else if(t==='jail'){p.skip=1;p.cash-=100;note('🚔 罚款 ¥100，并暂停 1 回合')}else if(t==='tax'){p.cash-=150;note('🧾 税务 -¥150')}next()}render();</script></body></html>
