function render(){document.querySelectorAll('.tile').forEach(x=>x.remove());tiles.forEach((t,i)=>{let d=document.createElement('div');d.className='tile '+t.t+(t.owner!==null?' o'+t.owner:'');d.dataset.lv=t.lv||0;const path=[[16,68],[13,57],[14,44],[17,31],[25,22],[36,17],[49,16],[62,18],[74,23],[84,31],[88,43],[87,55],[82,66],[73,75],[62,81],[49,83],[37,81],[27,76],[22,67],[25,57],[31,49],[39,43],[51,40],[64,43]];let q=path[i]||[50,50];d.style.left=q[0]+'%';d.style.top=q[1]+'%';d.innerHTML=`<div class=e>${t.e}</div><b>${t.n}</b>${t.price?`<div>¥${t.price}</div>`:''}${t.lv?`<div>Lv.${t.lv} ${'🏠'.repeat(t.lv)}</div>`:''}<div class=tok>${ps.map(p=>p.alive&&p.pos===i?p.face:'').join('')}</div>`;document.getElementById('board').appendChild(d)});document.getElementById('players').innerHTML=ps.map((p,i)=>`<div class="p ${i===turn?'on':''}" style="opacity:${p.alive?1:.45}"><b>${p.face} P${i+1} ${p.n} ${p.type==='ai'?'🤖':'👤'}</b><div class=cash>¥${p.cash}</div><div class=status>${p.place?`${p.place} ${p.skip}回合`:''}${p.lucky?` 🍀${p.lucky}`:''}${p.degree?' 🎓毕业':''}</div></div>`).join('');let p=ps[turn],t=tiles[p.pos];document.getElementById('turn').textContent=p.face+' '+p.n+(p.type==='ai'?' 🤖 AI':' 👤 真人')+' 的回合';document.getElementById('hint').textContent=p.type==='ai'?'AI 正在思考策略…':'选择卡片或掷骰子';document.getElementById('roll').disabled=busy;let qr=document.getElementById('quickRoll');if(qr)qr.disabled=busy;document.getElementById('count').textContent=`${p.cards.length}/${bagMax(p)}`;document.getElementById('cards').innerHTML=p.cards.length?p.cards.map((c,i)=>`<button class=card onclick="inspectCard('${c}',${i})">${cardDef[c][0]} <b>${cardDef[c][1]}</b><small>${cardDef[c][2]}</small></button>`).join(''):'暂无卡片';document.getElementById('stocks').innerHTML=stocks.map((s,i)=>{let qty=p.shares[i],avg=qty?Math.round(p.stockCost[i]/qty):0,pnl=qty?(s.p*qty-p.stockCost[i]):0;return `<div class=stock style="grid-template-columns:1fr auto"><div><b>${s.n}</b><br><small>¥${s.p} <span class="${s.d>=0?'up':'down'}">${s.d>0?'▲'+s.d:s.d<0?'▼'+Math.abs(s.d):'—'}</span></small><br><small>持仓 ${qty} · 均价 ¥${avg} · <span class="${pnl>=0?'up':'down'}">${pnl>=0?'+':''}¥${pnl}</span></small></div><div><button class="mini" onclick="tradeStock('buy',${i})">买</button><button class="mini" onclick="tradeStock('sell',${i})">卖</button></div></div>`}).join('');let stockValue=p.shares.reduce((a,q,i)=>a+q*stocks[i].p,0),stockCost=p.stockCost.reduce((a,v)=>a+v,0),stockPnl=stockValue-stockCost;document.getElementById('stockSummary').innerHTML=`📊 股票资产 <b>¥${stockValue}</b><br>累计成本 ¥${stockCost} · <span class="${stockPnl>=0?'up':'down'}">浮动盈亏 ${stockPnl>=0?'+':''}¥${stockPnl}</span><br>💼 现金+股票 ¥${p.cash+stockValue}`;document.getElementById('status').innerHTML=`${p.lucky?'🍀 好运：剩余 '+p.lucky+' 回合<br>':''}${p.shield?'🛡️ 下次免过路费<br>':''}${discount?'🏗️ 下次建设半价<br>':''}${p.degree?'🎓 大学毕业：经过起点奖金 +¥50<br>':''}⭐ ${skillName(p.skill)}`;if(t.t==='land'){let b=Math.max(40,Math.round(t.price*.18)),arr=[b,Math.round(b*1.8),Math.round(b*3),Math.round(b*5)];document.getElementById('info').innerHTML=`<b>${t.e} ${t.n}</b><br>地价 ¥${t.price}<br>业主 ${t.owner===null?'无人':ps[t.owner].n}<br>当前等级 Lv.${t.lv}<div class=tolls>空地 ¥${arr[0]}<br>Lv.1 ¥${arr[1]} · Lv.2 ¥${arr[2]} · Lv.3 ¥${arr[3]}</div>${t.owner===turn&&t.lv<3?`<button class=btn onclick=upgrade()>🏗️ 升级 ¥${buildCost(t)}</button>`:''}`}else document.getElementById('info').innerHTML=`${t.e} ${t.n}`}
function popup(i,t,x,buttons,extra=''){document.getElementById('mi').textContent=i;document.getElementById('mt').textContent=t;document.getElementById('mx').textContent=x;document.getElementById('extra').innerHTML=extra;let b=document.getElementById('mb');b.innerHTML='';buttons.forEach(z=>{let e=document.createElement('button');e.className='btn';e.textContent=z[0];e.onclick=z[1];b.appendChild(e)});document.getElementById('modal').classList.add('show')}function close(){document.getElementById('modal').classList.remove('show')}
function next(){if(checkEnd())return;let old=turn;do{turn=(turn+1)%ps.length}while(!ps[turn].alive);let p=ps[turn];if(p.lucky>0)p.lucky--;discount=false;busy=false;document.getElementById('roll').disabled=false;let qr=document.getElementById('quickRoll');if(qr)qr.disabled=false;if(p.skip>0){p.skip--;let place=p.place;log(`${place} ${p.n}：剩余 ${p.skip} 回合`);let reward=place==='🏥医院'?100:0;if(reward){p.cash+=reward;log(`🏥 ${p.n} 获得医院慰问金 ¥100`)}if(p.skip===0){if(place==='🎓大学'){p.degree=1;log(`🎓 ${p.n} 毕业！经过起点额外 +¥50`)}p.place=''}render();setTimeout(next,1100);return}render();scheduleAI()}
document.getElementById('roll').onclick=async()=>{if(busy||document.getElementById('modal').classList.contains('show'))return;busy=true;document.getElementById('roll').disabled=true;let qr=document.getElementById('quickRoll');if(qr)qr.disabled=true;try{let n=forced||Math.floor(Math.random()*6)+1;forced=null;for(let i=0;i<8;i++){document.getElementById('dice').textContent=df[Math.floor(Math.random()*6)];await sleep(55)}document.getElementById('dice').textContent=df[n-1];let p=ps[turn];log(`🎲 ${p.n} 掷出 ${n}`);for(let i=0;i<n;i++){let old=p.pos;p.pos=(p.pos+1)%24;if(p.pos<old){let pay=300+(p.degree?50:0);if(p.skill==='traveler')pay=Math.round(pay*1.2);p.cash+=pay;log(`🏁 ${p.n} 经过起点 +¥${pay}`)}render();await sleep(190)}resolve()}catch(e){console.error(e);busy=false;document.getElementById('roll').disabled=false;if(qr)qr.disabled=false;toast('⚠️ 回合异常，已恢复操作',1800)}};
function resolve(){let p=ps[turn],t=tiles[p.pos];if(t.t==='land'){if(t.owner===null){if(p.type==='ai'){if(aiBuy(t)){log(`🤖 ${p.n} 决定购买 ${t.n}`);buy(t)}else{log(`🤖 ${p.n} 放弃购买 ${t.n}`);next()}return}popup(t.e,t.n,`地价 ¥${t.price}，购买后当前过路费 ¥${toll(t)}。`,[['购买',()=>buy(t)],['跳过',()=>{close();next()}]]);return}if(t.owner!==turn){let fee=toll(t),owner=ps[t.owner];if(p.skill==='pass'&&p.passCount>=2){p.passCount=0;log(`🛡️ ${p.n} 的通行特权免除过路费 ¥${fee}`);toast(`🛡️ 通行特权：免除 ¥${fee}`,1000);next();return}if(p.lucky>0||p.shield>0){if(p.shield>0)p.shield--;log(`🛡️ ${p.n} 免除 ${t.n} 过路费 ¥${fee}`);popup('🛡️','免除过路费',`${p.n} 不需要支付 ¥${fee}！`,[['继续',()=>{close();next()}]]);return}p.cash-=fee;owner.cash+=fee;log(`💸 ${p.n} 支付 ${owner.n} 过路费 ¥${fee}`);toast(`💸 过路费 ¥${fee}`,900);popup('💸','过路费结算',`${p.n} → ${owner.n}：¥${fee}`,[['确认',()=>{close();bankrupt();next()}]]);return}}else if(t.t==='shop'){spin();return}else if(t.t==='special'){special(t);return}else if(t.t==='tax'){p.cash-=t.price;log(`🧾 ${p.n} 缴税 ¥${t.price}`)}else if(t.t==='event'){let market=Math.random()<.35;if(market){let s=stocks[Math.floor(Math.random()*stocks.length)],up=Math.random()>.45,m=Math.round(s.p*(up?.18:-.15)),old=s.p;s.p=Math.max(20,s.p+m);s.d=s.p-old;log(`📰 市场新闻：${s.n} ${up?'大涨':'下跌'} ${Math.abs(s.d)}`);toast(`📰 ${s.n} ${up?'▲':'▼'}${Math.abs(s.d)}`,1200)}let gain=Math.random()>.5?250:-150;p.cash+=gain;popup('✨','随机事件',gain>0?`获得奖金 ¥${gain}`:`意外支出 ¥${-gain}`,[['继续',()=>{close();bankrupt();next()}]]);return}bankrupt();next()}
function buy(t){let p=ps[turn];if(p.cash>=t.price){p.cash-=t.price;t.owner=turn;t.lv=1;p.props.push(t.id);log(`🏡 ${p.n} 买下 ${t.n}`)}close();render();next()}function upgrade(){if(busy)return;let p=ps[turn],t=tiles[p.pos],c=buildCost(t);if(p.cash>=c&&t.owner===turn&&t.lv<3){p.cash-=c;t.lv++;if(discount)discount=false;log(`🏗️ ${t.n} 升级 Lv.${t.lv}`);render()}}
function special(t){let p=ps[turn];if(t.n==='监狱'&&p.type==='ai'){if(p.cash>900){p.cash-=300;log(`🤖 ${p.n} 支付 ¥300 保释金`);next()}else{p.skip=3;p.place='🚔监狱';log(`🤖 ${p.n} 选择服刑 3 回合`);next()}return}if(t.n==='监狱'){popup('🚔','进入监狱',`需要停留 3 回合，或支付 ¥${p.skill==='negotiator'?150:300} 保释。`,[['保释',()=>{let bail=p.skill==='negotiator'?150:300;if(p.cash>=bail){p.cash-=bail;close();next()}else alert('现金不足')}],['服刑',()=>{p.skip=3;p.place='🚔监狱';close();next()}]]);return}p.skip=3;p.place=t.n==='医院'?'🏥医院':'🎓大学';if(t.n==='大学'&&p.skill==='tutor'){let targets=players.map((x,j)=>({x,j})).filter(o=>o.j!==turn&&o.x.alive);if(targets.length){let q=targets.sort((a,b)=>b.x.cash-a.x.cash)[0].x,fee=Math.floor(q.cash*.05);q.cash-=fee;p.cash+=fee;log(`🎓 ${p.n} 为 ${q.n} 补课，收取 ¥${fee}`);toast(`🎓 补课费 +¥${fee}`,1100)}}let txt=t.n==='医院'?'住院 3 回合，每回合获得慰问金 ¥100。':'上课 3 回合，毕业后经过起点永久多获得 ¥50。';if(p.type==='ai'){log(`${t.e} 🤖 ${p.n} 进入${t.n} 3回合`);next();return}popup(t.e,'进入'+t.n,`${p.face} ${p.n}：${txt}`,[['开始',()=>{close();next()}]])}
function spin(){if(ps[turn].type==='ai'){let pool=['remote','remote','bonus','bonus','shield','build','freeze','steal','split','lucky'],c=pool[Math.floor(Math.random()*pool.length)];if(ps[turn].cards.length<8){ps[turn].cards.push(c);log(`🎡 🤖 ${ps[turn].n} 抽到 ${cardDef[c][1]}`)}next();return}let extra='<div id="wheel" class="wheel">🎡</div>';popup('🎡','幸运卡片转盘','点击开始，抽取一张功能卡！',[['开始抽卡',doSpin]],extra)}function doSpin(){let p=ps[turn],pool=['remote','remote','bonus','bonus','shield','build','freeze','steal','split','lucky'],c=pool[Math.floor(Math.random()*pool.length)],w=document.getElementById('wheel');w.style.transform=`rotate(${1440+Math.random()*900}deg)`;document.getElementById('mb').innerHTML='';setTimeout(()=>{if(p.cards.length<bagMax(p)){p.cards.push(c);log(`🎡 ${p.n} 抽到 ${cardDef[c][1]}`);toast(`${cardDef[c][0]} 获得 ${cardDef[c][1]}`,1200)}document.getElementById('mx').textContent=p.cards.length<=8?`获得：${cardDef[c][0]} ${cardDef[c][1]}`:'背包已满';let b=document.getElementById('mb'),e=document.createElement('button');e.className='btn';e.textContent='收下';e.onclick=()=>{close();next()};b.appendChild(e);render()},2500)}
function inspectCard(c,i){if(busy||ps[turn].type==='ai')return;popup(cardDef[c][0],cardDef[c][1],cardDef[c][2],[['使用',()=>{close();useCard(c,i)}],['取消',close]])}
function tradeStock(mode,i){if(busy||players[turn].type==='ai')return;let p=players[turn],s=stocks[i],fee=p.skill==='investor'?0:Math.max(1,Math.round(s.p*.03));if(mode==='buy'){let cost=s.p+fee;if(p.cash>=cost){p.cash-=cost;p.shares[i]++;p.stockCost[i]+=s.p;log(`📈 ${p.n} 买入 ${s.n} 1股，成交 ¥${s.p}${fee?' + 手续费 ¥'+fee:''}`);toast(`📈 买入 ${s.n} @ ¥${s.p}`,800)}else toast('💸 现金不足')}else{if(p.shares[i]>0){let avg=p.stockCost[i]/p.shares[i];p.shares[i]--;p.stockCost[i]=Math.max(0,p.stockCost[i]-avg);let bonus=p.skill==='investor'?Math.round(s.p*.1):0,proceeds=s.p+bonus;p.cash+=proceeds;log(`📉 ${p.n} 卖出 ${s.n} 1股，获得 ¥${proceeds}`);toast(`📉 卖出 ${s.n} @ ¥${s.p}`,800)}else toast('没有可卖出的股票')}render()}
function useCard(c,i){if(busy)return;let p=ps[turn];const consume=()=>p.cards.splice(i,1);if(c==='bonus'){consume();p.cash+=250;log(`💰 ${p.n} 使用奖金卡 +¥250`)}else if(c==='shield'){consume();p.shield++;log(`🛡️ ${p.n} 获得一次免租`)}else if(c==='lucky'){consume();p.lucky=5;log(`🍀 ${p.n} 好运状态 5 回合`)}else if(c==='build'){consume();discount=true;log(`🏗️ ${p.n} 下次建设半价`)}else if(c==='remote'){let n=Number(prompt('指定骰子 1-6'));if(n>=1&&n<=6){consume();forced=n}}else targetCard(c,i);render()}
function targetCard(c,i){let p=ps[turn],targets=ps.map((x,j)=>({x,j})).filter(o=>o.j!==turn&&o.x.alive);popup(cardDef[c][0],cardDef[c][1],'请选择目标玩家',targets.map(o=>[`${o.x.face} ${o.x.n}`,()=>applyTarget(c,i,o.j)]))}function applyTarget(c,i,j){let p=ps[turn],q=ps[j];if(c==='freeze'){q.skip=Math.max(q.skip,1);q.place='⏸️停留'}else if(c==='split'){let avg=Math.floor((p.cash+q.cash)/2);p.cash=avg;q.cash=avg;log(`⚖️ ${p.n} 与 ${q.n} 均分现金，各 ¥${avg}`)}else if(c==='steal'){if(q.cards.length){let k=Math.floor(Math.random()*q.cards.length),got=q.cards.splice(k,1)[0];if(p.cards.length<bagMax(p))p.cards.push(got);log(`🫳 ${p.n} 从 ${q.n} 抢到 ${cardDef[got][1]}`)}else log(`${q.n} 没有卡片可抢`)}p.cards.splice(i,1);close();render()}
function scheduleAI(){let p=ps[turn];if(p&&p.type==='ai'&&!busy&&!document.getElementById('modal').classList.contains('show'))setTimeout(aiTurn,850)}
function aiTarget(){return ps.map((x,j)=>({x,j})).filter(o=>o.j!==turn&&o.x.alive).sort((a,b)=>b.x.cash-a.x.cash)[0]}
function aiUseTargetCard(p,type){let i=p.cards.indexOf(type),tar=aiTarget();if(i<0||!tar)return false;let q=tar.x;if(type==='split'&&q.cash>p.cash+500){let avg=Math.floor((p.cash+q.cash)/2);p.cash=q.cash=avg;p.cards.splice(i,1);log(`⚖️ 🤖 ${p.n} 对 ${q.n} 使用均分卡，各 ¥${avg}`);return true}if(type==='steal'&&q.cards.length){let k=Math.floor(Math.random()*q.cards.length),got=q.cards.splice(k,1)[0];p.cards.splice(i,1);if(p.cards.length<8)p.cards.push(got);log(`🫳 🤖 ${p.n} 从 ${q.n} 抢到 ${cardDef[got][1]}`);return true}if(type==='freeze'&&q.skip===0){q.skip=1;q.place='⏸️停留';p.cards.splice(i,1);log(`⏸️ 🤖 ${p.n} 让 ${q.n} 停留一回合`);return true}return false}
function aiUpgrade(p){let owned=p.props.map(id=>tiles[id]).filter(t=>t.lv<3).sort((a,b)=>toll(b)-toll(a));if(!owned.length)return false;let t=owned[0],base=Math.round(t.price*(.55+t.lv*.15)),useBuild=p.cards.indexOf('build');if(useBuild>=0&&base>220&&p.cash-base*.5>500){p.cards.splice(useBuild,1);p.cash-=Math.round(base*.5);t.lv++;log(`🏗️ 🤖 ${p.n} 使用建设卡，将 ${t.n} 升至 Lv.${t.lv}`);return true}if(p.cash-base>750){p.cash-=base;t.lv++;log(`🏗️ 🤖 ${p.n} 将 ${t.n} 升至 Lv.${t.lv}`);return true}return false}
async function aiTurn(){let p=ps[turn];if(!p||p.type!=='ai'||busy)return;let bi=p.cards.indexOf('bonus');if(bi>=0&&p.cash<900){p.cards.splice(bi,1);p.cash+=250;log(`💰 🤖 ${p.n} 使用奖金卡 +¥250`)}if(!aiUseTargetCard(p,'split')){if(Math.random()<.35)aiUseTargetCard(p,'steal');if(Math.random()<.25)aiUseTargetCard(p,'freeze')}let li=p.cards.indexOf('lucky');if(li>=0&&!p.lucky&&p.cash>800&&Math.random()<.3){p.cards.splice(li,1);p.lucky=5;log(`🍀 🤖 ${p.n} 使用好运卡`)}let si=p.cards.indexOf('shield');if(si>=0&&!p.shield&&p.cash<800){p.cards.splice(si,1);p.shield=1;log(`🛡️ 🤖 ${p.n} 使用免租卡`)}if(p.skill==='investor'&&Math.random()<.35){let s=stocks[0];if(p.cash>s.p+600){p.cash-=s.p;p.shares[0]++;p.stockCost[0]+=s.p;log(`📈 🤖 ${p.n} 买入 ${s.n}`)}else if(p.shares[0]&&p.cash<500){let avg=p.stockCost[0]/p.shares[0];p.shares[0]--;p.stockCost[0]=Math.max(0,p.stockCost[0]-avg);p.cash+=Math.round(s.p*1.1);log(`📉 🤖 ${p.n} 卖出 ${s.n}`)}}aiUpgrade(p);let ri=p.cards.indexOf('remote');if(ri>=0&&Math.random()<.22){p.cards.splice(ri,1);forced=4+Math.floor(Math.random()*3);log(`🎯 🤖 ${p.n} 使用遥控骰子，指定 ${forced}`)}render();toast(`🤖 ${p.n} 决策完成`,650);setTimeout(()=>document.getElementById('roll').click(),850)}
function aiBuy(t){let p=ps[turn],reserve=p.props.length<2?350:550;return p.cash-t.price>=reserve||(t.price<=300&&p.cash>t.price+250)}function netWorth(p){let land=p.props.reduce((a,id)=>{let t=tiles[id];return a+t.price+Math.round(t.price*t.lv*.55)},0),stock=p.shares.reduce((a,q,i)=>a+q*stocks[i].p,0);return {cash:p.cash,land,stock,total:Math.max(0,p.cash)+land+stock}}function settleGame(winner){let worth=netWorth(winner),standard=(setup.startingCash||1500)===1500,reward=standard?Math.max(100,Math.round(worth.total*.08)):Math.max(50,Math.round(worth.total*.03)),old=Number(localStorage.getItem('richman_global_wealth')||0),nw=old+reward;localStorage.setItem('richman_global_wealth',nw);localStorage.setItem('richman_last_settlement',JSON.stringify({winner:winner.n,net:worth.total,reward,wealth:nw,date:Date.now()}));let html=`<div class="settle"><div>💵 现金<b>¥${worth.cash}</b></div><div>🏠 地产估值<b>¥${worth.land}</b></div><div>📈 股票资产<b>¥${worth.stock}</b></div></div><p>本局净资产：<b>¥${worth.total}</b></p><p>🌍 Global Wealth 奖励：<b>+${reward}</b></p><p>累计 Global Wealth：<b>${nw}</b></p>`;popup('🏆','梦想岛结算',`${winner.face} ${winner.n} 成为本局首富！`,[['返回世界',()=>location.href='./world.html'],['再来一局',()=>{close();init()}]],html)}function bankrupt(){let p=ps[turn];if(p.cash<0){p.alive=false;p.props.forEach(id=>{tiles[id].owner=null;tiles[id].lv=0});p.props=[];log(`💥 ${p.n} 破产`)}}function checkEnd(){let a=ps.filter(p=>p.alive);if(a.length===1){popup('🏆','梦想岛首富',`${a[0].face} ${a[0].n} 获胜！`,[['再来一局',()=>{close();init()}]]);return true}return false}function restart(){if(confirm('重新开始？'))init()}init();setTimeout(scheduleAI,500);
</script><script src="./theme.js"></script></body></html>
