<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>财富环游记 V4 · 梦想岛</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'PingFang SC',sans-serif;background:linear-gradient(#66caf0,#238fbf);color:#173653;min-height:100vh}.app{max-width:1380px;margin:auto;padding:14px}.app:before{content:'☁️   ☁️      🎈      ☁️';position:fixed;inset:20px 0 auto;text-align:center;font-size:38px;letter-spacing:9vw;opacity:.45;pointer-events:none}.top{display:grid;grid-template-columns:220px repeat(4,1fr);gap:8px}.logo,.p{border-radius:18px;padding:10px;box-shadow:0 6px 14px #17415c55}.logo{background:linear-gradient(#ffe66c,#f4a82c);border:5px solid #fff0a9;font-weight:1000;font-size:22px;box-shadow:0 7px 0 #a96524,0 12px 22px #17445d55;transform:rotate(-1deg)}.p{background:#153e62;color:white;border:2px solid #82d4f4}.p.on{outline:4px solid #ffe36a}.p .cash{font-size:18px;color:#ffe36a;font-weight:900}.layout{display:grid;grid-template-columns:245px 1fr 260px;gap:10px;margin-top:12px}.panel{background:linear-gradient(180deg,#174e78f2,#103b60f2);color:white;border:3px solid #83d4f2;border-radius:22px;padding:13px;margin-bottom:10px;box-shadow:0 9px 0 #0b5478,0 14px 28px #08354b55}.panel h3{margin:0 0 10px;color:#fff3a3;text-shadow:0 2px #16415e}.boardbox{background:radial-gradient(circle at 50% 48%,#e7f5bd 0 28%,#a9dc7c 29% 54%,#f2d78b 55% 58%,#59b8dc 59%);padding:25px;border:5px solid #d9f1ff;border-radius:42px;box-shadow:0 18px 0 #1a789f,0 28px 45px #06476377;position:relative}.boardbox:after{content:'🌴  🏖️  ⛵  🌴';position:absolute;bottom:-10px;left:0;right:0;text-align:center;font-size:30px;pointer-events:none}.board{height:650px;display:grid;grid-template:repeat(7,1fr)/repeat(7,1fr);gap:5px}.tile{position:relative;background:linear-gradient(#fff5ad,#f3cf5c);border:3px solid #fff9dc;border-radius:13px;text-align:center;padding:4px;font-size:9px;box-shadow:0 6px 0 #9b7833,0 8px 10px #315b4b55;transition:.18s}.tile:hover{transform:translateY(-3px) scale(1.03);z-index:8}.tile.land:before{content:'🏡';position:absolute;right:-4px;top:-15px;font-size:20px;filter:drop-shadow(0 3px 2px #3456)}.tile.event{background:linear-gradient(#c5f2ff,#72cbed)}.tile.shop{background:linear-gradient(#d7ffc8,#7fd57b)}.tile.special{background:linear-gradient(#ffd9d4,#ff9d91)}.tile.tax{background:linear-gradient(#e4eaff,#aebfe9)}.tile.start{background:linear-gradient(#fff7cc,#ffad77)}.tile .e{font-size:21px}.tile .tok{position:absolute;left:50%;top:50%;transform:translate(-50%,-20%);font-size:25px;white-space:nowrap}.tile.o0{outline:4px solid #ff6d75}.tile.o1{outline:4px solid #5cbcff}.tile.o2{outline:4px solid #ffc840}.tile.o3{outline:4px solid #5fd27a}.center{grid-area:2/2/7/7;background:radial-gradient(circle,#fff7d2 0 18%,#c9eba0 19% 56%,#8fd37c 57%);border-radius:44%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:5px solid #efffcf;box-shadow:inset 0 0 35px #43875555}.center:before{content:'⛲';font-size:62px;filter:drop-shadow(0 7px 3px #3456);margin-bottom:-8px}.dice{font-size:64px}.roll,.btn{border:0;border-radius:13px;padding:10px 16px;font-weight:900;cursor:pointer}.roll{font-size:20px;background:linear-gradient(#ff8067,#ed4e40);color:white;border:4px solid #ffd9a4;box-shadow:0 7px #a83830,0 12px 20px #2348}.roll:hover{transform:translateY(-2px)}.btn{background:#ffd04e;color:#2b3a46;margin:3px}.card{display:block;width:100%;text-align:left;border:3px solid #ffe494;border-radius:14px;background:linear-gradient(135deg,#fffdf4,#fff0bd);color:#173653;padding:10px;margin:7px 0;cursor:pointer;box-shadow:0 4px 0 #d79d35;transition:.15s}.card:hover{transform:translateX(4px)}.card:disabled{opacity:.4}.log{height:190px;overflow:auto;font-size:12px}.log div{padding:5px;border-bottom:1px solid #ffffff22}.modal{position:fixed;inset:0;background:#082f4bb9;display:none;place-items:center;z-index:20}.modal.show{display:grid}.dialog{background:#fff6d9;border:5px solid #f1bd45;border-radius:25px;padding:20px;width:min(500px,92vw);text-align:center}.big{font-size:55px}.wheel{width:260px;height:260px;border-radius:50%;margin:12px auto;border:9px solid #ffcf4f;background:conic-gradient(#ff8a76 0 18%,#75c8ff 18% 36%,#9ddd79 36% 52%,#f3d663 52% 67%,#c99aff 67% 79%,#ff9bc1 79% 89%,#72e0c6 89% 96%,#ff765f 96%);display:grid;place-items:center;font-size:65px;transition:transform 2.4s cubic-bezier(.15,.8,.15,1)}.status{color:#ffe36a;font-size:11px}.tolls{font-size:11px;line-height:1.7}@media(max-width:900px){.top{grid-template-columns:1fr 1fr}.logo{grid-column:1/-1}.layout{grid-template-columns:1fr}.boardbox{order:-1}.board{height:570px}}@media(max-width:560px){.app{padding:5px}.boardbox{padding:8px}.board{height:470px;gap:2px}.tile{font-size:6px;padding:1px}.tile .e{font-size:13px}.tile .tok{font-size:16px}.center{padding:4px}.dice{font-size:42px}}</style></head><body><div class="app"><div class="top"><div class="logo">💰 财富环游记<br><small>RICH MAN · DREAM ISLAND · V4</small></div><div id="players" style="display:contents"></div></div><div class="layout"><aside><div class="panel"><h3>🎒 我的卡包 <span id="count"></span></h3><div id="cards"></div></div><div class="panel"><h3>⭐ 玩家状态</h3><div id="status"></div></div></aside><main class="boardbox"><div id="board" class="board"><div class="center"><h2 id="turn">小熊的回合</h2><div id="hint">选择卡片或掷骰子</div><div id="dice" class="dice">⚀</div><button id="roll" class="roll">🎲 掷骰子</button></div></div></main><aside><div class="panel"><h3>🏠 地产情报</h3><div id="info"></div></div><div class="panel"><h3>📣 最新事件</h3><div id="log" class="log"></div></div><button class="btn" onclick="restart()">↻ 重开</button></aside></div></div><div id="modal" class="modal"><div class="dialog"><div id="mi" class="big"></div><h2 id="mt"></h2><p id="mx"></p><div id="extra"></div><div id="mb"></div></div></div><script>
const names=['小熊','兔兔','咪咪','Dino'],faces=['🧸','🐰','🐱','🦖'],df=['⚀','⚁','⚂','⚃','⚄','⚅'];const cardDef={remote:['🎯','遥控骰子'],bonus:['💰','奖金卡'],shield:['🛡️','免租卡'],build:['🏗️','建设卡'],freeze:['⏸️','停留卡'],split:['⚖️','均分卡'],steal:['🫳','抢夺卡'],lucky:['🍀','好运卡']};const base=[['起点','🏁','start',0],['咖啡馆','☕','land',200],['机会','❓','event',0],['大学','🎓','special',0],['税务局','🧾','tax',120],['美食街','🍜','land',260],['游乐园','🎡','land',300],['幸运转盘','🎡','shop',0],['森林小屋','🌲','land',320],['医院','🏥','special',0],['幸运日','🍀','event',0],['科技公司','💻','land',390],['银行街','🏦','land',430],['购物中心','🛍️','land',460],['新闻','📰','event',0],['艺术广场','🎨','land',490],['监狱','🚔','special',0],['摩天大楼','🏙️','land',530],['黄金海岸','🌅','land',580],['幸运转盘','🎡','shop',0],['豪华酒店','🏨','land',650],['命运','🔮','event',0],['中央广场','⛲','land',700],['梦想之巅','👑','land',780]];const pos=[];for(let c=6;c>=0;c--)pos.push([6,c]);for(let r=5;r>=0;r--)pos.push([r,0]);for(let c=1;c<=6;c++)pos.push([0,c]);for(let r=1;r<=5;r++)pos.push([r,6]);let tiles,ps,turn,busy,forced,discount;let setup={count:4,hero:0,types:['human','ai','ai','ai']};try{setup=Object.assign(setup,JSON.parse(localStorage.getItem('richman_setup')||'{}'))}catch(e){}
function init(){tiles=base.map((x,i)=>({n:x[0],e:x[1],t:x[2],price:x[3],owner:null,lv:0,id:i}));let order=[setup.hero,...[0,1,2,3].filter(x=>x!==setup.hero)].slice(0,setup.count||4);ps=order.map((ci,i)=>({n:names[ci],face:faces[ci],cash:1500,pos:0,alive:true,props:[],cards:['remote','bonus'],lucky:0,shield:0,skip:0,place:'',degree:0,type:(setup.types&&setup.types[i])||'ai'}));turn=0;busy=false;forced=null;discount=false;document.getElementById('log').innerHTML='';log('🌴 梦想岛 V3 开始！');render()}
function toll(t){let b=Math.max(40,Math.round(t.price*.18));return [b,Math.round(b*1.8),Math.round(b*3),Math.round(b*5)][t.lv]}function buildCost(t){return Math.round(t.price*(.55+t.lv*.15)*(discount?.5:1))}function log(x){let d=document.createElement('div');d.textContent=x;document.getElementById('log').prepend(d)}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function render(){document.querySelectorAll('.tile').forEach(x=>x.remove());tiles.forEach((t,i)=>{let d=document.createElement('div');d.className='tile '+t.t+(t.owner!==null?' o'+t.owner:'');d.style.gridRow=pos[i][0]+1;d.style.gridColumn=pos[i][1]+1;d.innerHTML=`<div class=e>${t.e}</div><b>${t.n}</b>${t.price?`<div>¥${t.price}</div>`:''}${t.lv?`<div>Lv.${t.lv} ${'🏠'.repeat(t.lv)}</div>`:''}<div class=tok>${ps.map(p=>p.alive&&p.pos===i?p.face:'').join('')}</div>`;document.getElementById('board').appendChild(d)});document.getElementById('players').innerHTML=ps.map((p,i)=>`<div class="p ${i===turn?'on':''}" style="opacity:${p.alive?1:.45}"><b>${p.face} P${i+1} ${p.n} ${p.type==='ai'?'🤖':'👤'}</b><div class=cash>¥${p.cash}</div><div class=status>${p.place?`${p.place} ${p.skip}回合`:''}${p.lucky?` 🍀${p.lucky}`:''}${p.degree?' 🎓毕业':''}</div></div>`).join('');let p=ps[turn],t=tiles[p.pos];document.getElementById('turn').textContent=p.face+' '+p.n+(p.type==='ai'?' 🤖 AI':' 👤 真人')+' 的回合';document.getElementById('hint').textContent=p.type==='ai'?'AI 正在思考策略…':'选择卡片或掷骰子';document.getElementById('roll').disabled=p.type==='ai'||busy;document.getElementById('count').textContent=`${p.cards.length}/8`;document.getElementById('cards').innerHTML=p.cards.length?p.cards.map((c,i)=>`<button class=card onclick="useCard('${c}',${i})">${cardDef[c][0]} <b>${cardDef[c][1]}</b></button>`).join(''):'暂无卡片';document.getElementById('status').innerHTML=`${p.lucky?'🍀 好运：剩余 '+p.lucky+' 回合<br>':''}${p.shield?'🛡️ 下次免过路费<br>':''}${discount?'🏗️ 下次建设半价<br>':''}${p.degree?'🎓 大学毕业：经过起点奖金 +¥50':'普通状态'}`;if(t.t==='land'){let b=Math.max(40,Math.round(t.price*.18)),arr=[b,Math.round(b*1.8),Math.round(b*3),Math.round(b*5)];document.getElementById('info').innerHTML=`<b>${t.e} ${t.n}</b><br>地价 ¥${t.price}<br>业主 ${t.owner===null?'无人':ps[t.owner].n}<br>当前等级 Lv.${t.lv}<div class=tolls>空地 ¥${arr[0]}<br>Lv.1 ¥${arr[1]} · Lv.2 ¥${arr[2]} · Lv.3 ¥${arr[3]}</div>${t.owner===turn&&t.lv<3?`<button class=btn onclick=upgrade()>🏗️ 升级 ¥${buildCost(t)}</button>`:''}`}else document.getElementById('info').innerHTML=`${t.e} ${t.n}`}
function popup(i,t,x,buttons,extra=''){document.getElementById('mi').textContent=i;document.getElementById('mt').textContent=t;document.getElementById('mx').textContent=x;document.getElementById('extra').innerHTML=extra;let b=document.getElementById('mb');b.innerHTML='';buttons.forEach(z=>{let e=document.createElement('button');e.className='btn';e.textContent=z[0];e.onclick=z[1];b.appendChild(e)});document.getElementById('modal').classList.add('show')}function close(){document.getElementById('modal').classList.remove('show')}
function next(){if(checkEnd())return;let old=turn;do{turn=(turn+1)%ps.length}while(!ps[turn].alive);let p=ps[turn];if(p.lucky>0)p.lucky--;discount=false;busy=false;document.getElementById('roll').disabled=false;if(p.skip>0){p.skip--;let place=p.place;let reward=place==='🏥医院'?100:0;if(reward){p.cash+=reward;log(`🏥 ${p.n} 获得医院慰问金 ¥100`)}if(p.skip===0){if(place==='🎓大学'){p.degree=1;log(`🎓 ${p.n} 毕业！经过起点额外 +¥50`)}p.place=''}render();setTimeout(next,700);return}render();scheduleAI()}
document.getElementById('roll').onclick=async()=>{if(busy)return;busy=true;document.getElementById('roll').disabled=true;let n=forced||Math.floor(Math.random()*6)+1;forced=null;for(let i=0;i<8;i++){document.getElementById('dice').textContent=df[Math.floor(Math.random()*6)];await sleep(55)}document.getElementById('dice').textContent=df[n-1];let p=ps[turn];log(`🎲 ${p.n} 掷出 ${n}`);for(let i=0;i<n;i++){let old=p.pos;p.pos=(p.pos+1)%24;if(p.pos<old){let pay=300+(p.degree?50:0);p.cash+=pay;log(`🏁 ${p.n} 经过起点 +¥${pay}`)}render();await sleep(140)}resolve()};
function resolve(){let p=ps[turn],t=tiles[p.pos];if(t.t==='land'){if(t.owner===null){if(p.type==='ai'){if(aiBuy(t)){log(`🤖 ${p.n} 决定购买 ${t.n}`);buy(t)}else{log(`🤖 ${p.n} 放弃购买 ${t.n}`);next()}return}popup(t.e,t.n,`地价 ¥${t.price}，购买后当前过路费 ¥${toll(t)}。`,[['购买',()=>buy(t)],['跳过',()=>{close();next()}]]);return}if(t.owner!==turn){let fee=toll(t),owner=ps[t.owner];if(p.lucky>0||p.shield>0){if(p.shield>0)p.shield--;log(`🛡️ ${p.n} 免除 ${t.n} 过路费 ¥${fee}`);popup('🛡️','免除过路费',`${p.n} 不需要支付 ¥${fee}！`,[['继续',()=>{close();next()}]]);return}p.cash-=fee;owner.cash+=fee;log(`💸 ${p.n} 支付 ${owner.n} 过路费 ¥${fee}`);popup('💸','过路费结算',`${p.n} → ${owner.n}：¥${fee}`,[['确认',()=>{close();bankrupt();next()}]]);return}}else if(t.t==='shop'){spin();return}else if(t.t==='special'){special(t);return}else if(t.t==='tax'){p.cash-=t.price;log(`🧾 ${p.n} 缴税 ¥${t.price}`)}else if(t.t==='event'){let gain=Math.random()>.5?250:-150;p.cash+=gain;popup('✨','随机事件',gain>0?`获得奖金 ¥${gain}`:`意外支出 ¥${-gain}`,[['继续',()=>{close();bankrupt();next()}]]);return}bankrupt();next()}
function buy(t){let p=ps[turn];if(p.cash>=t.price){p.cash-=t.price;t.owner=turn;t.lv=1;p.props.push(t.id);log(`🏡 ${p.n} 买下 ${t.n}`)}close();render();next()}function upgrade(){if(busy)return;let p=ps[turn],t=tiles[p.pos],c=buildCost(t);if(p.cash>=c&&t.owner===turn&&t.lv<3){p.cash-=c;t.lv++;if(discount)discount=false;log(`🏗️ ${t.n} 升级 Lv.${t.lv}`);render()}}
function special(t){let p=ps[turn];if(t.n==='监狱'&&p.type==='ai'){if(p.cash>900){p.cash-=300;log(`🤖 ${p.n} 支付 ¥300 保释金`);next()}else{p.skip=3;p.place='🚔监狱';log(`🤖 ${p.n} 选择服刑 3 回合`);next()}return}if(t.n==='监狱'){popup('🚔','进入监狱','需要停留 3 回合，或支付 ¥300 保释。',[['保释 ¥300',()=>{if(p.cash>=300){p.cash-=300;close();next()}else alert('现金不足')}],['服刑',()=>{p.skip=3;p.place='🚔监狱';close();next()}]]);return}p.skip=3;p.place=t.n==='医院'?'🏥医院':'🎓大学';let txt=t.n==='医院'?'住院 3 回合，每回合获得慰问金 ¥100。':'上课 3 回合，毕业后经过起点永久多获得 ¥50。';popup(t.e,'进入'+t.n,txt,[['开始',()=>{close();next()}]])}
function spin(){if(ps[turn].type==='ai'){let pool=['remote','remote','bonus','bonus','shield','build','freeze','steal','split','lucky'],c=pool[Math.floor(Math.random()*pool.length)];if(ps[turn].cards.length<8){ps[turn].cards.push(c);log(`🎡 🤖 ${ps[turn].n} 抽到 ${cardDef[c][1]}`)}next();return}let extra='<div id="wheel" class="wheel">🎡</div>';popup('🎡','幸运卡片转盘','点击开始，抽取一张功能卡！',[['开始抽卡',doSpin]],extra)}function doSpin(){let p=ps[turn],pool=['remote','remote','bonus','bonus','shield','build','freeze','steal','split','lucky'],c=pool[Math.floor(Math.random()*pool.length)],w=document.getElementById('wheel');w.style.transform=`rotate(${1440+Math.random()*900}deg)`;document.getElementById('mb').innerHTML='';setTimeout(()=>{if(p.cards.length<8){p.cards.push(c);log(`🎡 ${p.n} 抽到 ${cardDef[c][1]}`)}document.getElementById('mx').textContent=p.cards.length<=8?`获得：${cardDef[c][0]} ${cardDef[c][1]}`:'背包已满';let b=document.getElementById('mb'),e=document.createElement('button');e.className='btn';e.textContent='收下';e.onclick=()=>{close();next()};b.appendChild(e);render()},2500)}
function useCard(c,i){if(busy)return;let p=ps[turn];const consume=()=>p.cards.splice(i,1);if(c==='bonus'){consume();p.cash+=250;log(`💰 ${p.n} 使用奖金卡 +¥250`)}else if(c==='shield'){consume();p.shield++;log(`🛡️ ${p.n} 获得一次免租`)}else if(c==='lucky'){consume();p.lucky=5;log(`🍀 ${p.n} 好运状态 5 回合`)}else if(c==='build'){consume();discount=true;log(`🏗️ ${p.n} 下次建设半价`)}else if(c==='remote'){let n=Number(prompt('指定骰子 1-6'));if(n>=1&&n<=6){consume();forced=n}}else targetCard(c,i);render()}
function targetCard(c,i){let p=ps[turn],targets=ps.map((x,j)=>({x,j})).filter(o=>o.j!==turn&&o.x.alive);popup(cardDef[c][0],cardDef[c][1],'请选择目标玩家',targets.map(o=>[`${o.x.face} ${o.x.n}`,()=>applyTarget(c,i,o.j)]))}function applyTarget(c,i,j){let p=ps[turn],q=ps[j];if(c==='freeze'){q.skip=Math.max(q.skip,1);q.place='⏸️停留'}else if(c==='split'){let avg=Math.floor((p.cash+q.cash)/2);p.cash=avg;q.cash=avg;log(`⚖️ ${p.n} 与 ${q.n} 均分现金，各 ¥${avg}`)}else if(c==='steal'){if(q.cards.length){let k=Math.floor(Math.random()*q.cards.length),got=q.cards.splice(k,1)[0];if(p.cards.length<8)p.cards.push(got);log(`🫳 ${p.n} 从 ${q.n} 抢到 ${cardDef[got][1]}`)}else log(`${q.n} 没有卡片可抢`)}p.cards.splice(i,1);close();render()}
function scheduleAI(){let p=ps[turn];if(p&&p.type==='ai'&&!busy&&!document.getElementById('modal').classList.contains('show'))setTimeout(aiTurn,850)}
function aiTarget(){return ps.map((x,j)=>({x,j})).filter(o=>o.j!==turn&&o.x.alive).sort((a,b)=>b.x.cash-a.x.cash)[0]}
function aiUseTargetCard(p,type){let i=p.cards.indexOf(type),tar=aiTarget();if(i<0||!tar)return false;let q=tar.x;if(type==='split'&&q.cash>p.cash+500){let avg=Math.floor((p.cash+q.cash)/2);p.cash=q.cash=avg;p.cards.splice(i,1);log(`⚖️ 🤖 ${p.n} 对 ${q.n} 使用均分卡，各 ¥${avg}`);return true}if(type==='steal'&&q.cards.length){let k=Math.floor(Math.random()*q.cards.length),got=q.cards.splice(k,1)[0];p.cards.splice(i,1);if(p.cards.length<8)p.cards.push(got);log(`🫳 🤖 ${p.n} 从 ${q.n} 抢到 ${cardDef[got][1]}`);return true}if(type==='freeze'&&q.skip===0){q.skip=1;q.place='⏸️停留';p.cards.splice(i,1);log(`⏸️ 🤖 ${p.n} 让 ${q.n} 停留一回合`);return true}return false}
function aiUpgrade(p){let owned=p.props.map(id=>tiles[id]).filter(t=>t.lv<3).sort((a,b)=>toll(b)-toll(a));if(!owned.length)return false;let t=owned[0],base=Math.round(t.price*(.55+t.lv*.15)),useBuild=p.cards.indexOf('build');if(useBuild>=0&&base>220&&p.cash-base*.5>500){p.cards.splice(useBuild,1);p.cash-=Math.round(base*.5);t.lv++;log(`🏗️ 🤖 ${p.n} 使用建设卡，将 ${t.n} 升至 Lv.${t.lv}`);return true}if(p.cash-base>750){p.cash-=base;t.lv++;log(`🏗️ 🤖 ${p.n} 将 ${t.n} 升至 Lv.${t.lv}`);return true}return false}
async function aiTurn(){let p=ps[turn];if(!p||p.type!=='ai'||busy)return;let bi=p.cards.indexOf('bonus');if(bi>=0&&p.cash<900){p.cards.splice(bi,1);p.cash+=250;log(`💰 🤖 ${p.n} 使用奖金卡 +¥250`)}if(!aiUseTargetCard(p,'split')){if(Math.random()<.35)aiUseTargetCard(p,'steal');if(Math.random()<.25)aiUseTargetCard(p,'freeze')}let li=p.cards.indexOf('lucky');if(li>=0&&!p.lucky&&p.cash>800&&Math.random()<.3){p.cards.splice(li,1);p.lucky=5;log(`🍀 🤖 ${p.n} 使用好运卡`)}let si=p.cards.indexOf('shield');if(si>=0&&!p.shield&&p.cash<800){p.cards.splice(si,1);p.shield=1;log(`🛡️ 🤖 ${p.n} 使用免租卡`)}aiUpgrade(p);let ri=p.cards.indexOf('remote');if(ri>=0&&Math.random()<.22){p.cards.splice(ri,1);forced=4+Math.floor(Math.random()*3);log(`🎯 🤖 ${p.n} 使用遥控骰子，指定 ${forced}`)}render();setTimeout(()=>document.getElementById('roll').click(),350)}
function aiBuy(t){let p=ps[turn],reserve=p.props.length<2?350:550;return p.cash-t.price>=reserve||(t.price<=300&&p.cash>t.price+250)}function bankrupt(){let p=ps[turn];if(p.cash<0){p.alive=false;p.props.forEach(id=>{tiles[id].owner=null;tiles[id].lv=0});p.props=[];log(`💥 ${p.n} 破产`)}}function checkEnd(){let a=ps.filter(p=>p.alive);if(a.length===1){popup('🏆','梦想岛首富',`${a[0].face} ${a[0].n} 获胜！`,[['再来一局',()=>{close();init()}]]);return true}return false}function restart(){if(confirm('重新开始？'))init()}init();setTimeout(scheduleAI,500);
</script></body></html>
