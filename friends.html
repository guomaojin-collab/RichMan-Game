<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RichMan World · 好友</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'PingFang SC',sans-serif;background:linear-gradient(#78d5f4,#2b9ac7);min-height:100vh;color:#173b58}.app{max-width:1000px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;color:white}.back{background:#174d74;color:white;border:2px solid #92ddf6;border-radius:14px;padding:9px 15px;text-decoration:none;font-weight:900}.hero,.box{background:#fff6df;border:4px solid #f1c45a;border-radius:24px;padding:18px;margin-top:15px}.hero{background:linear-gradient(135deg,#fff2b7,#bde99a);border-color:#fff6d2;box-shadow:0 9px 0 #287fa2}.search{display:flex;gap:8px}.search input{flex:1;padding:12px;border-radius:12px;border:2px solid #d8b353}.btn{border:0;border-radius:12px;padding:10px 15px;background:#174d74;color:white;font-weight:900;cursor:pointer}.primary{background:#ef5948}.friend{display:grid;grid-template-columns:55px 1fr auto;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #e7d5a7}.avatar{font-size:38px}.status{font-size:12px;color:#638071}.online{color:#279b55;font-weight:900}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;color:#72818a;padding:25px}.note{font-size:12px;color:#687b86}.modal{position:fixed;inset:0;background:#082e4bc7;display:none;place-items:center}.modal.show{display:grid}.dialog{width:min(480px,90vw);background:#fff6df;border:5px solid #f2c458;border-radius:24px;padding:20px;text-align:center}@media(max-width:560px){.friend{grid-template-columns:45px 1fr}.actions{grid-column:1/-1}.search{display:block}.search input,.search button{width:100%;margin:4px 0}}</style></head><body><div class="app"><header class="head"><div><h1>👥 好友</h1><small>RICHMAN WORLD SOCIAL</small></div><a class="back" href="./world.html">← 世界大厅</a></header><section class="hero"><h2>和朋友一起环游世界</h2><p>搜索 RichMan ID、添加好友，并邀请好友进入你的大富翁世界。</p><div class="search"><input id="query" placeholder="输入玩家昵称或 RichMan ID"><button class="btn primary" onclick="searchUser()">🔎 搜索</button></div><div id="searchResult"></div></section><section class="box"><h2>🟢 我的好友 <span id="friendCount"></span></h2><div id="friends"></div></section><section class="box"><h2>📨 好友请求</h2><div id="requests" class="empty">暂时没有新的好友请求</div></section><p class="note">当前版本为本地社交原型。真实跨设备搜索、好友请求和在线状态需要云端账号 API，上线后会沿用同一界面。</p></div><div id="modal" class="modal"><div class="dialog"><div id="mi" style="font-size:50px">👤</div><h2 id="mt"></h2><p id="mx"></p><button class="btn primary" onclick="modal.classList.remove('show')">关闭</button></div></div><script>const demo=[{id:'RM-20481',name:'Luna',avatar:'🐰',wealth:6910300,online:true},{id:'RM-51802',name:'Kiki',avatar:'🐱',wealth:5880500,online:false},{id:'RM-88314',name:'Mira',avatar:'🦊',wealth:9420100,online:true}];function getFriends(){try{return JSON.parse(localStorage.getItem('richman_friends')||'[]')}catch(e){return[]}}function saveFriends(x){localStorage.setItem('richman_friends',JSON.stringify(x));render()}function searchUser(){let q=query.value.trim().toLowerCase();if(!q){searchResult.innerHTML='';return}let u=demo.find(x=>x.name.toLowerCase().includes(q)||x.id.toLowerCase()===q);searchResult.innerHTML=u?'<div class="friend"><div class="avatar">'+u.avatar+'</div><div><b>'+u.name+'</b><br><small>'+u.id+' · 💰 '+u.wealth.toLocaleString()+'</small></div><div class="actions"><button class="btn" onclick="add(\''+u.id+'\')">➕ 添加好友</button><button class="btn" onclick="view(\''+u.id+'\')">查看主页</button></div></div>':'<div class="empty">没有找到玩家。当前只能搜索原型示例玩家。</div>'}function add(id){let f=getFriends();if(!f.includes(id)){f.push(id);saveFriends(f)}searchResult.innerHTML='<p class="online">✓ 已添加到本地好友列表</p>'}function removeFriend(id){saveFriends(getFriends().filter(x=>x!==id))}function view(id){let u=demo.find(x=>x.id===id);mi.textContent=u.avatar;mt.textContent=u.name+' · '+u.id;mx.textContent='Global Wealth：'+u.wealth.toLocaleString()+'。公开主页后续还会展示其发布的世界和好友可见状态。';modal.classList.add('show')}function invite(id){let u=demo.find(x=>x.id===id);mi.textContent='🎮';mt.textContent='邀请 '+u.name;mx.textContent='联机房间上线后，这里会发送真实游戏邀请。当前已完成邀请流程界面。';modal.classList.add('show')}function render(){let f=getFriends();friendCount.textContent='('+f.length+')';friends.innerHTML=f.length?f.map(id=>{let u=demo.find(x=>x.id===id);if(!u)return'';return'<div class="friend"><div class="avatar">'+u.avatar+'</div><div><b>'+u.name+'</b> <span class="'+(u.online?'online':'status')+'">'+(u.online?'● 在线':'● 离线')+'</span><br><small>'+u.id+' · 💰 '+u.wealth.toLocaleString()+'</small></div><div class="actions"><button class="btn primary" onclick="invite(\''+id+'\')">🎮 邀请</button><button class="btn" onclick="view(\''+id+'\')">主页</button><button class="btn" onclick="removeFriend(\''+id+'\')">移除</button></div></div>'}).join(''):'<div class="empty">还没有好友。试试搜索 Luna、Kiki 或 Mira。</div>'}render();</script></body></html>
