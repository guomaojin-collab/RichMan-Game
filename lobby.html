<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>财富环游记 · V4 开局大厅</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'PingFang SC',sans-serif;background:linear-gradient(#75d1f1,#2b9bc7);color:#173a58;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:24px}.head{text-align:center;color:white;text-shadow:0 3px #287aa0}.head h1{font-size:46px;margin:6px}.head p{font-weight:800}.panel{background:#fff6dc;border:5px solid #f5c65a;border-radius:28px;padding:22px;box-shadow:0 18px 40px #17445d55}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.count button{border:3px solid #6bbfe3;background:white;border-radius:16px;padding:11px 22px;font-weight:900;cursor:pointer}.count button.on{background:#ffcf50;border-color:#e79532}.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.char{background:white;border:4px solid #b6def0;border-radius:22px;padding:15px;text-align:center;cursor:pointer;transition:.15s}.char.on{border-color:#ffb62e;transform:translateY(-5px);box-shadow:0 9px 0 #e49b28}.face{font-size:70px}.char b{display:block;font-size:20px}.char small{display:block;color:#718291;margin-top:5px}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.slot{background:#16496f;color:white;border-radius:18px;padding:13px}.slot select{width:100%;margin-top:7px;padding:8px;border-radius:9px;border:0}.actions{text-align:center;margin-top:22px}.start{border:4px solid #ffd9a1;background:linear-gradient(#ff7960,#ed4c3e);color:white;border-radius:20px;padding:14px 38px;font-size:20px;font-weight:1000;box-shadow:0 7px #a43830;cursor:pointer}.back{display:inline-block;margin:14px;color:#235775;font-weight:800;text-decoration:none}.map{background:#d9f0a7;border-radius:20px;padding:13px;text-align:center;font-weight:900;margin:14px 0}.locked{opacity:.45}@media(max-width:720px){.chars,.slots{grid-template-columns:1fr 1fr}.head h1{font-size:32px}.face{font-size:50px}} </style></head><body><div class="wrap"><header class="head"><h1>🏝️ 梦想岛开局大厅</h1><p>DREAM ISLAND · 选择你的冒险伙伴</p></header><main class="panel"><h3>① 玩家人数</h3><div class="row count"><button onclick="setCount(2)">2 人</button><button onclick="setCount(3)">3 人</button><button class="on" onclick="setCount(4)">4 人</button></div><h3>② 选择你的角色</h3><div class="chars"><div class="char on" data-i="0" onclick="choose(0)"><div class="face">🧸</div><b>小熊</b><small>建设达人 · 地产升级更省钱</small></div><div class="char" data-i="1" onclick="choose(1)"><div class="face">🐰</div><b>兔兔</b><small>旅行达人 · 经过起点奖励更高</small></div><div class="char" data-i="2" onclick="choose(2)"><div class="face">🐱</div><b>咪咪</b><small>投资达人 · 擅长股票市场</small></div><div class="char" data-i="3" onclick="choose(3)"><div class="face">🦖</div><b>Dino</b><small>幸运达人 · 特殊事件更从容</small></div></div><h3>③ 玩家 / AI 设置</h3><div id="slots" class="slots"></div><h3>④ 地图</h3><div class="map">🏝️ 梦想岛 · DREAM ISLAND　<span>经典经济模式</span></div><div class="row"><div class="map locked">🌃 未来城 · 敬请期待</div><div class="map locked">❄️ 雪国镇 · 敬请期待</div></div><div class="actions"><button class="start" onclick="start()">🎲 进入梦想岛</button><br><a class="back" href="./index.html">← 返回封面</a></div></main></div><script>let count=4,hero=0;const names=['小熊','兔兔','咪咪','Dino'],faces=['🧸','🐰','🐱','🦖'];function setCount(n){count=n;document.querySelectorAll('.count button').forEach((b,i)=>b.classList.toggle('on',i===n-2));draw()}function choose(i){hero=i;document.querySelectorAll('.char').forEach((x,j)=>x.classList.toggle('on',j===i));draw()}function draw(){let s=document.getElementById('slots');s.innerHTML='';let order=[hero,...[0,1,2,3].filter(x=>x!==hero)];for(let i=0;i<count;i++){let c=order[i],d=document.createElement('div');d.className='slot';d.innerHTML='<b>'+faces[c]+' P'+(i+1)+' '+names[c]+'</b><select id="type'+i+'"><option value="human">'+(i===0?'真人玩家':'真人玩家')+'</option><option value="ai" '+(i?'selected':'')+'>🤖 AI 玩家</option></select>';s.appendChild(d)}}function start(){let types=[];for(let i=0;i<count;i++)types.push(document.getElementById('type'+i).value);localStorage.setItem('richman_setup',JSON.stringify({count,hero,types,map:'dream'}));location.href='./v3.html'}draw();</script></body></html>
