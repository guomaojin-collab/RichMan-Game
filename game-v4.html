<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>财富环游记 V4 · 梦想岛</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'PingFang SC',sans-serif;background:#55bfe5;color:#173b58;min-height:100vh;overflow-x:hidden}.app{max-width:1500px;margin:auto;padding:12px}.hud{display:grid;grid-template-columns:230px repeat(4,1fr);gap:8px;position:relative;z-index:10}.logo{background:linear-gradient(#ffe768,#f2a42c);border:5px solid #fff0a9;border-radius:24px;padding:10px;text-align:center;font-weight:1000;box-shadow:0 7px #a76523}.player{background:linear-gradient(#174f79,#103b60);color:white;border:3px solid #8bd8f5;border-radius:18px;padding:8px 12px}.player.on{outline:4px solid #ffe775}.money{font-weight:1000;color:#ffe26d;font-size:18px}.shell{display:grid;grid-template-columns:220px minmax(680px,1fr) 240px;gap:10px;margin-top:12px}.panel{background:#123d61ed;color:white;border:3px solid #80d0ee;border-radius:20px;padding:12px;box-shadow:0 8px #0b5b80}.panel h3{color:#fff0a0;margin:0 0 9px}.scene{height:720px;position:relative;border:6px solid #dff6ff;border-radius:42px;overflow:hidden;background:linear-gradient(#9be3fa 0 17%,#54bde0 17% 100%);box-shadow:0 18px #197da5,0 28px 45px #06435d77}.island{position:absolute;inset:8% 5% 4%;background:radial-gradient(ellipse at center,#dff3ad 0 42%,#94d371 43% 67%,#f3d48a 68% 72%,#57b4d8 73%);border-radius:47% 53% 42% 46%;filter:drop-shadow(0 18px 8px #17677b66)}.lake{position:absolute;left:35%;top:27%;width:30%;height:37%;border-radius:48%;background:radial-gradient(ellipse,#bdeffc,#64c9e8 70%,#3da7cf);border:7px solid #efffcf}.park{position:absolute;left:43%;top:36%;width:14%;height:18%;border-radius:50%;background:#bce58a;border:5px solid #f5efbd;display:grid;place-items:center;font-size:60px;filter:drop-shadow(0 6px 3px #3656)}.road{position:absolute;inset:15% 12% 12%;border:38px solid #f4e2b5;border-radius:42%;box-shadow:inset 0 0 0 5px #d7bd83,0 5px 0 #ad9569}.road:after{content:'';position:absolute;inset:-22px;border:3px dashed #fff8dc;border-radius:40%}.node{position:absolute;width:66px;height:66px;border-radius:50%;background:linear-gradient(#fff6b7,#f4c94e);border:4px solid #fff9df;box-shadow:0 6px 0 #9d7630,0 9px 12px #274b4a55;display:grid;place-items:center;text-align:center;font-size:10px;font-weight:900;z-index:4}.node .ico{font-size:24px;line-height:1}.node.event{background:linear-gradient(#d1f4ff,#70c8e8)}.node.shop{background:linear-gradient(#d7ffc7,#79d17b)}.node.special{width:92px;height:82px;border-radius:20px;background:linear-gradient(#fff2dc,#ffba9d);font-size:11px}.node.owned0{outline:5px solid #ff6d76}.node.owned1{outline:5px solid #5dbdff}.node.owned2{outline:5px solid #ffc83f}.node.owned3{outline:5px solid #5dd17a}.pawn{position:absolute;z-index:8;font-size:35px;transform:translate(-50%,-70%);filter:drop-shadow(0 5px 3px #2347);transition:left .18s,top .18s}.building{position:absolute;z-index:3;font-size:45px;filter:drop-shadow(0 7px 3px #3456);pointer-events:none}.centerUI{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;text-align:center;background:#16486fdd;color:white;border:3px solid #9bdcf3;border-radius:22px;padding:10px 18px;min-width:220px}.dice{font-size:58px}.roll,.btn{border:0;border-radius:13px;padding:10px 16px;font-weight:900;cursor:pointer}.roll{background:linear-gradient(#ff7d63,#ed4d3f);color:white;border:3px solid #ffd7a0;box-shadow:0 5px #a43a31}.card{width:100%;border:2px solid #ffe08a;background:#fff8d7;color:#173b58;border-radius:12px;padding:8px;text-align:left;margin:5px 0;font-weight:800}.log{height:190px;overflow:auto;font-size:12px}.log div{padding:5px;border-bottom:1px solid #ffffff22}.modal{position:fixed;inset:0;background:#082f4bc5;display:none;place-items:center;z-index:30}.modal.show{display:grid}.dialog{width:min(480px,92vw);background:#fff5d8;border:5px solid #f2bd45;border-radius:25px;padding:20px;text-align:center}.wheel{width:230px;height:230px;border-radius:50%;margin:10px auto;border:8px solid #ffd152;background:conic-gradient(#ff8b77 0 18%,#73c9ff 18% 36%,#9ede7b 36% 52%,#f3d667 52% 67%,#c99aff 67% 79%,#ff9bc1 79% 89%,#72dfc6 89% 96%,#ff765f 96%);display:grid;place-items:center;font-size:60px;transition:transform 2.3s cubic-bezier(.15,.8,.15,1)}@media(max-width:1050px){.hud{grid-template-columns:1fr 1fr}.logo{grid-column:1/-1}.shell{grid-template-columns:1fr}.scene{order:-1;height:650px}.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}}@media(max-width:650px){.scene{height:520px}.shell{display:block}.panel{margin:8px 0}.node{width:48px;height:48px;font-size:7px}.node .ico{font-size:16px}.node.special{width:65px;height:58px}.building{font-size:30px}.pawn{font-size:25px}.road{border-width:27px}.hud{font-size:11px}}</style></head><body><div class="app"><div class="hud"><div class="logo">💰 财富环游记<br><small>梦想岛 · V4</small></div><div id="players" style="display:contents"></div></div><div class="shell"><aside class="side"><div class="panel"><h3>🎒 卡片背包</h3><div id="cards"></div></div><div class="panel"><h3>⭐ 玩家状态</h3><div id="status"></div></div></aside><main id="scene" class="scene"><div class="island"></div><div class="road"></div><div class="lake"></div><div class="park">⛲</div><div class="building" style="left:18%;top:22%">🎡</div><div class="building" style="right:17%;top:20%">🏨</div><div class="building" style="left:18%;bottom:18%">☕</div><div class="building" style="right:18%;bottom:17%">🏙️</div><div class="centerUI"><b id="turn">梦想岛</b><div id="hint">选择卡片或掷骰子</div><div id="dice" class="dice">⚀</div><button id="roll" class="roll">🎲 掷骰子</button></div></main><aside class="side"><div class="panel"><h3>🏠 地产情报</h3><div id="info"></div></div><div class="panel"><h3>📣 最新事件</h3><div id="log" class="log"></div></div><button class="btn" onclick="location.href='./lobby.html'">← 返回大厅</button></aside></div></div><div id="modal" class="modal"><div class="dialog"><div id="mi" style="font-size:55px"></div><h2 id="mt"></h2><p id="mx"></p><div id="extra"></div><div id="mb"></div></div></div><script>
const names=['小熊','兔兔','咪咪','Dino'],faces=['🧸','🐰','🐱','🦖'],df=['⚀','⚁','⚂','⚃','⚄','⚅'];const cardDef={remote:['🎯','遥控骰子'],bonus:['💰','奖金卡'],shield:['🛡️','免租卡'],build:['🏗️','建设卡'],freeze:['⏸️','停留卡'],split:['⚖️','均分卡'],steal:['🫳','抢夺卡'],lucky:['🍀','好运卡']};const base=[['起点','🏁','start',0],['咖啡馆','☕','land',200],['机会','❓','event',0],['大学','🎓','special',0],['税务局','🧾','tax',120],['美食街','🍜','land',260],['游乐园','🎡','land',300],['幸运转盘','🎁','shop',0],['森林小屋','🌲','land',320],['医院','🏥','special',0],['幸运日','🍀','event',0],['科技公司','💻','land',390],['银行街','🏦','land',430],['购物中心','🛍️','land',460],['新闻','📰','event',0],['艺术广场','🎨','land',490],['监狱','🚔','special',0],['摩天大楼','🏙️','land',530],['黄金海岸','🌅','land',580],['幸运转盘','🎁','shop',0],['豪华酒店','🏨','land',650],['命运','🔮','event',0],['中央广场','⛲','land',700],['梦想之巅','👑','land',780]];let setup={count:4,hero:0,types:['human','ai','ai','ai']};try{setup=Object.assign(setup,JSON.parse(localStorage.getItem('richman_setup')||'{}'))}catch(e){}let tiles,ps,turn,busy,forced,discount;const coords=[];for(let i=0;i<24;i++){let q=i/24,a=Math.PI*2*q+Math.PI/2;coords.push([50+39*Math.cos(a),50+36*Math.sin(a)])}
function init(){tiles=base.map((x,i)=>({n:x[0],e:x[1],t:x[2],price:x[3],owner:null,lv:0,id:i}));let order=[setup.hero,...[0,1,2,3].filter(x=>x!==setup.hero)].slice(0,setup.count||4);ps=order.map((ci,i)=>({n:names[ci],face:faces[ci],cash:1500,pos:0,alive:true,props:[],cards:['remote','bonus'],lucky:0,shield:0,skip:0,place:'',degree:0,type:(setup.types&&setup.types[i])||'ai'}));turn=0;busy=false;forced=null;discount=false;log('🌴 欢迎来到真正的梦想岛！');render();setTimeout(scheduleAI,600)}
function toll(t){let b=Math.max(40,Math.round(t.price*.18));return[b,Math.round(b*1.8),Math.round(b*3),Math.round(b*5)][t.lv]}function buildCost(t){return Math.round(t.price*(.55+t.lv*.15)*(discount?.5:1))}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function log(x){let d=document.createElement('div');d.textContent=x;document.getElementById('log').prepend(d)}
function render(){document.querySelectorAll('.node,.pawn.dynamic').forEach(x=>x.remove());tiles.forEach((t,i)=>{let d=document.createElement('div');d.className='node '+t.t+(t.owner!==null?' owned'+t.owner:'');d.style.left=coords[i][0]+'%';d.style.top=coords[i][1]+'%';d.style.transform='translate(-50%,-50%)';d.innerHTML='<div><div class="ico">'+t.e+'</div>'+t.n+(t.lv?'<br>Lv.'+t.lv:'')+'</div>';document.getElementById('scene').appendChild(d)});ps.forEach((p,i)=>{if(!p.alive)return;let d=document.createElement('div');d.className='pawn dynamic';d.style.left=(coords[p.pos][0]+(i-1.5)*1.2)+'%';d.style.top=(coords[p.pos][1]+(i%2)*2)+'%';d.textContent=p.face;document.getElementById('scene').appendChild(d)});document.getElementById('players').innerHTML=ps.map((p,i)=>'<div class="player '+(i===turn?'on':'')+'" style="opacity:'+(p.alive?1:.45)+'"><b>'+p.face+' P'+(i+1)+' '+p.n+' '+(p.type==='ai'?'🤖':'👤')+'</b><div class="money">¥'+p.cash+'</div><small>'+ (p.place?p.place+' '+p.skip+'回合':'地产 '+p.props.length)+'</small></div>').join('');let p=ps[turn],t=tiles[p.pos];document.getElementById('turn').textContent=p.face+' '+p.n+(p.type==='ai'?' 🤖':' 👤')+' 的回合';document.getElementById('hint').textContent=p.type==='ai'?'AI 正在思考…':'选择卡片或掷骰子';document.getElementById('roll').disabled=p.type==='ai'||busy;document.getElementById('cards').innerHTML=p.cards.length?p.cards.map((c,i)=>'<button class="card" onclick="useCard(\''+c+'\','+i+')">'+cardDef[c][0]+' '+cardDef[c][1]+'</button>').join(''):'暂无卡片';document.getElementById('status').innerHTML=(p.lucky?'🍀 好运 '+p.lucky+' 回合<br>':'')+(p.shield?'🛡️ 下次免过路费<br>':'')+(p.degree?'🎓 大学毕业<br>':'')+(p.place?p.place+'：剩余 '+p.skip+' 回合':'正常旅行中');document.getElementById('info').innerHTML=t.t==='land'?'<b>'+t.e+' '+t.n+'</b><br>地价 ¥'+t.price+'<br>当前 Lv.'+t.lv+'<br>过路费 ¥'+toll(t)+'<br>业主：'+(t.owner===null?'无人':ps[t.owner].n)+(t.owner===turn&&t.lv<3?'<br><button class="btn" onclick="upgrade()">🏗️ 升级 ¥'+buildCost(t)+'</button>'):'':t.e+' '+t.n}
function popup(i,t,x,buttons,extra=''){mi.textContent=i;mt.textContent=t;mx.textContent=x;document.getElementById('extra').innerHTML=extra;mb.innerHTML='';buttons.forEach(z=>{let b=document.createElement('button');b.className='btn';b.textContent=z[0];b.onclick=z[1];mb.appendChild(b)});modal.classList.add('show')}function close(){modal.classList.remove('show')}
function next(){if(checkEnd())return;do{turn=(turn+1)%ps.length}while(!ps[turn].alive);let p=ps[turn];if(p.lucky>0)p.lucky--;discount=false;busy=false;if(p.skip>0){p.skip--;if(p.place==='🏥医院'){p.cash+=100;log('🏥 '+p.n+' 获得慰问金 ¥100')}if(!p.skip){if(p.place==='🎓大学'){p.degree=1;log('🎓 '+p.n+' 大学毕业！')}p.place=''}render();setTimeout(next,650);return}render();scheduleAI()}
roll.onclick=async()=>{if(busy)return;busy=true;roll.disabled=true;let n=forced||Math.floor(Math.random()*6)+1;forced=null;for(let i=0;i<7;i++){dice.textContent=df[Math.floor(Math.random()*6)];await sleep(55)}dice.textContent=df[n-1];let p=ps[turn];log('🎲 '+p.n+' 掷出 '+n);for(let i=0;i<n;i++){let old=p.pos;p.pos=(p.pos+1)%24;if(p.pos<old){let pay=300+(p.degree?50:0);p.cash+=pay;log('🏁 '+p.n+' 经过起点 +¥'+pay)}render();await sleep(190)}resolve()}
function resolve(){let p=ps[turn],t=tiles[p.pos];if(t.t==='land'){if(t.owner===null){if(p.type==='ai'){if(p.cash-t.price>450)buy(t);else next();return}popup(t.e,t.n,'地价 ¥'+t.price+'，购买后过路费 ¥'+toll(t),[['购买',()=>buy(t)],['跳过',()=>{close();next()}]]);return}if(t.owner!==turn){let fee=toll(t),o=ps[t.owner];if(p.lucky||p.shield){if(p.shield)p.shield--;log('🛡️ '+p.n+' 免除过路费 ¥'+fee);next();return}p.cash-=fee;o.cash+=fee;log('💸 '+p.n+' 支付 '+o.n+' ¥'+fee);if(p.type==='ai'){bankrupt();next()}else popup('💸','过路费结算',p.n+' → '+o.n+'：¥'+fee,[['确认',()=>{close();bankrupt();next()}]]);return}}else if(t.t==='shop'){spin();return}else if(t.t==='special'){special(t);return}else if(t.t==='tax'){p.cash-=t.price;log('🧾 '+p.n+' 缴税 ¥'+t.price)}else if(t.t==='event'){let g=Math.random()>.5?250:-150;p.cash+=g;log('✨ '+p.n+(g>0?' 获得 ¥'+g:' 支出 ¥'+(-g)))}bankrupt();next()}
function buy(t){let p=ps[turn];if(p.cash>=t.price){p.cash-=t.price;t.owner=turn;t.lv=1;p.props.push(t.id);log('🏡 '+p.n+' 买下 '+t.n)}close();render();next()}function upgrade(){if(busy)return;let p=ps[turn],t=tiles[p.pos],c=buildCost(t);if(t.owner===turn&&t.lv<3&&p.cash>=c){p.cash-=c;t.lv++;log('🏗️ '+t.n+' 升级到 Lv.'+t.lv);render()}}
function special(t){let p=ps[turn];if(t.n==='监狱'){if(p.type==='ai'){if(p.cash>900){p.cash-=300;log('🚔 '+p.n+' 支付保释金')}else{p.skip=3;p.place='🚔监狱'}next();return}popup('🚔','进入监狱','停留 3 回合，或支付 ¥300 保释。',[['保释 ¥300',()=>{if(p.cash>=300){p.cash-=300;close();next()}}],['服刑',()=>{p.skip=3;p.place='🚔监狱';close();next()}]]);return}p.skip=3;p.place=t.n==='医院'?'🏥医院':'🎓大学';log(t.e+' '+p.n+' 进入'+t.n);next()}
function spin(){let p=ps[turn],pool=['remote','bonus','shield','build','freeze','steal','split','lucky'];if(p.type==='ai'){let c=pool[Math.floor(Math.random()*pool.length)];if(p.cards.length<8)p.cards.push(c);log('🎁 '+p.n+' 抽到 '+cardDef[c][1]);next();return}popup('🎁','幸运卡片转盘','点击开始抽取功能卡！',[['开始抽卡',()=>{let c=pool[Math.floor(Math.random()*pool.length)],w=document.getElementById('wheel');w.style.transform='rotate('+(1500+Math.random()*800)+'deg)';mb.innerHTML='';setTimeout(()=>{if(p.cards.length<8)p.cards.push(c);mx.textContent='获得 '+cardDef[c][0]+' '+cardDef[c][1];let b=document.createElement('button');b.className='btn';b.textContent='收下';b.onclick=()=>{close();next()};mb.appendChild(b);render()},2300)}]],'<div id="wheel" class="wheel">🎡</div>')}
function useCard(c,i){if(busy||ps[turn].type==='ai')return;let p=ps[turn];if(c==='bonus'){p.cards.splice(i,1);p.cash+=250}else if(c==='shield'){p.cards.splice(i,1);p.shield=1}else if(c==='lucky'){p.cards.splice(i,1);p.lucky=5}else if(c==='build'){p.cards.splice(i,1);discount=true}else if(c==='remote'){let n=Number(prompt('指定 1-6'));if(n>=1&&n<=6){p.cards.splice(i,1);forced=n}}else{let tar=ps.map((x,j)=>({x,j})).filter(o=>o.j!==turn&&o.x.alive);popup(cardDef[c][0],cardDef[c][1],'选择目标',tar.map(o=>[o.x.face+' '+o.x.n,()=>applyTarget(c,i,o.j)]));return}render()}
function applyTarget(c,i,j){let p=ps[turn],q=ps[j];if(c==='freeze'){q.skip=1;q.place='⏸️停留'}if(c==='split'){let a=Math.floor((p.cash+q.cash)/2);p.cash=q.cash=a}if(c==='steal'&&q.cards.length){let k=Math.floor(Math.random()*q.cards.length),g=q.cards.splice(k,1)[0];if(p.cards.length<8)p.cards.push(g)}p.cards.splice(i,1);close();render()}
function scheduleAI(){if(ps[turn]&&ps[turn].type==='ai'&&!busy)setTimeout(aiTurn,800)}function aiTurn(){let p=ps[turn];if(!p||p.type!=='ai'||busy)return;let bi=p.cards.indexOf('bonus');if(bi>=0&&p.cash<850){p.cards.splice(bi,1);p.cash+=250}let li=p.cards.indexOf('lucky');if(li>=0&&!p.lucky&&Math.random()<.3){p.cards.splice(li,1);p.lucky=5}let own=p.props.map(id=>tiles[id]).filter(t=>t.lv<3).sort((a,b)=>toll(b)-toll(a))[0];if(own){let c=Math.round(own.price*(.55+own.lv*.15));if(p.cash-c>750){p.cash-=c;own.lv++;log('🤖 '+p.n+' 升级 '+own.n)}}let ri=p.cards.indexOf('remote');if(ri>=0&&Math.random()<.2){p.cards.splice(ri,1);forced=4+Math.floor(Math.random()*3)}render();setTimeout(()=>roll.click(),300)}
function bankrupt(){let p=ps[turn];if(p.cash<0){p.alive=false;p.props.forEach(id=>{tiles[id].owner=null;tiles[id].lv=0});p.props=[];log('💥 '+p.n+' 破产')}}function checkEnd(){let a=ps.filter(p=>p.alive);if(a.length===1){popup('🏆','梦想岛首富',a[0].face+' '+a[0].n+' 获胜！',[['返回大厅',()=>location.href='./lobby.html']]);return true}return false}init();
</script></body></html>
