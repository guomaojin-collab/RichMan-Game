<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RichMan World · World Builder</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'PingFang SC',sans-serif;background:linear-gradient(#78d5f4,#2b9ac7);color:#173b58;min-height:100vh}.app{max-width:1200px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;color:white}.back,.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:900;cursor:pointer;text-decoration:none}.back{background:#174d74;color:white;border:2px solid #91dcf5}.grid{display:grid;grid-template-columns:290px 1fr;gap:14px;margin-top:15px}.panel{background:#fff6df;border:4px solid #f1c45a;border-radius:24px;padding:16px}.field{margin:10px 0}.field label{display:block;font-weight:900;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:2px solid #d8b353;border-radius:10px}.palette{display:grid;grid-template-columns:1fr 1fr;gap:7px}.palette button{border:2px solid #8ccfe9;background:white;border-radius:12px;padding:9px;cursor:pointer;font-weight:800}.palette button.on{background:#ffe17a;border-color:#e49b2b}.canvas{min-height:650px;background:radial-gradient(circle,#dff1ad 0 35%,#95d171 36% 62%,#5db9dc 63%);border:6px solid #e5f8ff;border-radius:38px;position:relative;overflow:hidden}.route{position:absolute;inset:12%;border:34px solid #f3e0b2;border-radius:42%;box-shadow:inset 0 0 0 4px #c9ad75}.nodes{position:absolute;inset:0}.node{position:absolute;width:62px;height:62px;border-radius:50%;transform:translate(-50%,-50%);background:#fff2a1;border:4px solid white;box-shadow:0 5px #99722d;display:grid;place-items:center;text-align:center;font-size:9px;font-weight:900;cursor:pointer}.node span{font-size:22px;display:block}.node.selected{outline:5px solid #ef5948}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:55px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:#ef5948;color:white}.secondary{background:#174d74;color:white}.maps{margin-top:14px}.saved{display:flex;justify-content:space-between;align-items:center;background:white;border-radius:12px;padding:9px;margin:7px 0}.note{font-size:12px;color:#687b86}@media(max-width:800px){.grid{grid-template-columns:1fr}.canvas{min-height:540px}.node{width:48px;height:48px}}</style><link rel="stylesheet" href="./theme.css"></head><body><div class="app"><header class="head"><div><h1>🛠️ World Builder</h1><small>创建你自己的大富翁世界</small></div><a class="back" href="./world.html">← 世界大厅</a></header><div class="grid"><aside><section class="panel"><h2>世界设置</h2><div class="field"><label>🗺️ 地图名称</label><input id="mapName" value="我的梦想世界" maxlength="24"></div><div class="field"><label>💰 启动资金</label><input id="cash" type="number" min="500" max="100000" step="100" value="1500"></div><div class="field"><label>👥 最大玩家</label><select id="maxPlayers"><option>2</option><option>3</option><option selected>4</option></select></div><div class="field"><label>🛣️ 路线长度</label><select id="length" onchange="buildRoute()"><option value="16">16 格</option><option value="20">20 格</option><option value="24" selected>24 格</option><option value="28">28 格</option></select></div><h3>格子工具</h3><div id="palette" class="palette"></div><p class="note">先选择一种格子类型，再点击右侧路线上的节点进行替换。起点固定为第 1 格。</p><div class="actions"><button class="btn primary" onclick="saveMap()">💾 保存地图</button><button class="btn secondary" onclick="resetMap()">↻ 重置</button></div></section><section class="panel maps"><h2>📁 我的地图</h2><div id="savedMaps"></div></section></aside><main class="canvas"><div class="route"></div><div class="center">🏝️<br><b id="centerName" style="font-size:20px">我的梦想世界</b></div><div id="nodes" class="nodes"></div></main></div></div><script>const types={land:['🏠','地产'],event:['❓','机会'],shop:['🎁','转盘'],hospital:['🏥','医院'],university:['🎓','大学'],jail:['🚔','监狱'],tax:['🧾','税务']};let tool='land',route=[];function palette(){palette=document.getElementById('palette');palette.innerHTML=Object.entries(types).map(([k,v])=>'<button class="'+(k===tool?'on':'')+'" onclick="tool=\''+k+'\';palette()">'+v[0]+' '+v[1]+'</button>').join('')}function buildRoute(){let n=Number(length.value);route=Array.from({length:n},(_,i)=>i===0?'start':i%7===0?'shop':i%5===0?'event':'land');draw()}function coords(i,n){let a=Math.PI*2*i/n+Math.PI/2;return[50+39*Math.cos(a),50+37*Math.sin(a)]}function draw(){centerName.textContent=mapName.value;nodes.innerHTML=route.map((t,i)=>{let [x,y]=coords(i,route.length),v=t==='start'?['🏁','起点']:types[t];return'<div class="node" style="left:'+x+'%;top:'+y+'%" onclick="paint('+i+')"><div><span>'+v[0]+'</span>'+v[1]+'</div></div>'}).join('')}function paint(i){if(i===0)return;route[i]=tool;draw()}function resetMap(){buildRoute()}function getSaved(){try{return JSON.parse(localStorage.getItem('richman_worlds')||'[]')}catch(e){return[]}}function saveMap(){let name=mapName.value.trim()||'未命名世界',obj={id:'W-'+Date.now(),name,cash:Number(cash.value)||1500,maxPlayers:Number(maxPlayers.value),route:[...route],createdAt:Date.now()};let all=getSaved();all.unshift(obj);localStorage.setItem('richman_worlds',JSON.stringify(all.slice(0,20)));renderSaved();alert('地图已保存到「我的地图」')}function playMap(id){let x=getSaved().find(m=>m.id===id);if(!x)return;localStorage.setItem('richman_custom_map',JSON.stringify(x));localStorage.setItem('richman_setup',JSON.stringify({count:x.maxPlayers,hero:0,types:['human','ai','ai','ai'].slice(0,x.maxPlayers),startingCash:x.cash,skills:['pass','landlord','builder','traveler'].slice(0,x.maxPlayers),map:'custom'}));location.href='./custom-game.html'}function removeMap(id){localStorage.setItem('richman_worlds',JSON.stringify(getSaved().filter(x=>x.id!==id)));renderSaved()}function renderSaved(){let a=getSaved();savedMaps.innerHTML=a.length?a.map(x=>'<div class="saved"><div><b>'+x.name+'</b><br><small>'+x.route.length+' 格 · ¥'+x.cash+' · '+x.maxPlayers+'人</small></div><div><button class="btn primary" onclick="playMap(\''+x.id+'\')">🎮 试玩</button> <button class="btn secondary" onclick="removeMap(\''+x.id+'\')">删除</button></div></div>').join(''):'<div class="note">还没有创建地图。</div>'}mapName.oninput=()=>centerName.textContent=mapName.value;palette();buildRoute();renderSaved();</script><script src="./theme.js"></script></body></html>
