<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RichMan World · 财富排行榜</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'PingFang SC',sans-serif;background:linear-gradient(#78d5f4,#2b9ac7);min-height:100vh;color:#173b58}.app{max-width:980px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;color:white}.head h1{margin:0}.back{background:#174d74;color:white;border:2px solid #92ddf6;border-radius:14px;padding:9px 15px;text-decoration:none;font-weight:900}.hero{margin:18px 0;background:linear-gradient(135deg,#fff2b7,#bde99a);border:5px solid #fff6d2;border-radius:27px;padding:22px;box-shadow:0 10px 0 #287fa2}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:0;border-radius:13px;padding:10px 17px;font-weight:900;background:#164c73;color:white;cursor:pointer}.tabs button.on{background:#ef5a49}.board{margin-top:12px;background:#fff6df;border:4px solid #f1c45a;border-radius:24px;padding:15px}.row{display:grid;grid-template-columns:55px 1fr 150px;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #ead9ac}.row.me{background:#fff0a9;border-radius:15px}.rank{font-size:22px;font-weight:1000}.user{display:flex;align-items:center;gap:10px}.avatar{font-size:35px}.wealth{text-align:right;font-weight:1000;color:#b76524}.note{font-size:12px;color:#647783;margin-top:12px}.empty{text-align:center;padding:35px;color:#6a7b85}@media(max-width:550px){.row{grid-template-columns:42px 1fr 105px}.wealth{font-size:12px}}</style></head><body><div class="app"><header class="head"><div><h1>🏆 财富排行榜</h1><small>RICHMAN WORLD</small></div><a class="back" href="./world.html">← 世界大厅</a></header><section class="hero"><h2>🌍 谁是世界上最富有的 RichMan？</h2><p>排行榜最终将使用服务器验证的 Global Wealth。当前版本展示排行榜界面与本地玩家数据。</p><div class="tabs"><button id="globalBtn" class="on" onclick="show('global')">🌍 世界榜</button><button id="weeklyBtn" onclick="show('weekly')">📅 周榜</button><button id="friendsBtn" onclick="show('friends')">👥 好友榜</button></div></section><main id="board" class="board"></main></div><script>const demo=[['🥇','🐼','WorldBuilder','12,850,400'],['🥈','🦊','Mira','9,420,100'],['🥉','🐯','Leo','8,760,800'],['4','🐰','Luna','6,910,300'],['5','🐱','Kiki','5,880,500']];function me(){return{avatar:localStorage.getItem('richman_avatar')||'🧸',name:localStorage.getItem('richman_name')||'Guest Player',wealth:Number(localStorage.getItem('richman_global_wealth')||0)}}function show(type){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));document.getElementById(type+'Btn').classList.add('on');let b=document.getElementById('board'),m=me();if(type==='friends'){b.innerHTML='<div class="empty">👥 好友榜将在好友系统连接后显示。<br><small>你的好友之间可以比较 Global Wealth。</small></div>';return}let data=demo.map(x=>[...x]);if(type==='weekly')data=[['🥇','🐰','Luna','184,200'],['🥈','🐼','WorldBuilder','163,900'],['🥉','🐱','Kiki','142,700'],['4','🦊','Mira','121,500']];b.innerHTML=data.map(x=>'<div class="row"><div class="rank">'+x[0]+'</div><div class="user"><span class="avatar">'+x[1]+'</span><b>'+x[2]+'</b></div><div class="wealth">💰 '+x[3]+'</div></div>').join('')+'<div class="row me"><div class="rank">—</div><div class="user"><span class="avatar">'+m.avatar+'</span><div><b>'+m.name+'</b><br><small>你 · 本地原型账号</small></div></div><div class="wealth">💰 '+m.wealth.toLocaleString()+'</div></div><p class="note">⚠️ 示例玩家为界面占位数据，不代表真实全球排名。真实排名将在云端账号与服务器钱包上线后启用。</p>'}show('global');</script></body></html>
