<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RichMan World · 玩家世界</title><link rel="stylesheet" href="./theme.css"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'PingFang SC',sans-serif;min-height:100vh}.app{max-width:1050px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;color:white}.back{background:var(--navy);color:white;border:2px solid #9bdcf4;border-radius:13px;padding:9px 14px;text-decoration:none;font-weight:900}.hero,.section{background:var(--panel);border:4px solid var(--panel-border);border-radius:24px;padding:18px;margin-top:15px}.hero{background:linear-gradient(135deg,var(--panel),var(--soft))!important}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button{border:0;border-radius:12px;padding:9px 14px;background:var(--navy);color:white;font-weight:900;cursor:pointer}.worlds{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.world{background:white;border:3px solid var(--panel-border);border-radius:18px;padding:15px}.world .cover{font-size:45px}.meta{font-size:12px;color:#6a7d84}.btn{border:0;border-radius:12px;padding:9px 14px;background:var(--accent);color:white;font-weight:900;cursor:pointer}.empty{text-align:center;padding:35px;color:#71838b}@media(max-width:650px){.worlds{grid-template-columns:1fr}}</style></head><body><div class="app"><header class="head"><div><h1>🌍 玩家世界</h1><small>COMMUNITY WORLDS</small></div><a class="back" href="./world.html">← 世界大厅</a></header><section class="hero"><h2>探索全球玩家创造的大富翁版图</h2><p>当前版本先展示你在本机发布的公开地图。云端数据库上线后，这里会变成真正的全球世界浏览器。</p><div class="filters"><button onclick="render('all')">全部</button><button onclick="render('island')">🏝️ 海岛</button><button onclick="render('city')">🌆 都市</button><button onclick="render('snow')">❄️ 雪国</button><button onclick="render('night')">🌌 夜景</button></div></section><section class="section"><div id="worlds" class="worlds"></div></section></div><script>function all(){try{return JSON.parse(localStorage.getItem('richman_worlds')||'[]').filter(x=>x.visibility==='public')}catch(e){return[]}}function play(id){let x=all().find(m=>m.id===id);if(!x)return;localStorage.setItem('richman_custom_map',JSON.stringify(x));location.href='./custom-game.html'}function render(filter){let a=all();if(filter!=='all')a=a.filter(x=>(x.environment||'island')===filter);worlds.innerHTML=a.length?a.map(x=>'<article class="world"><div class="cover">'+({island:'🏝️',city:'🌆',snow:'❄️',night:'🌌'}[x.environment||'island'])+'</div><h3>'+x.name+'</h3><p class="meta">'+x.route.length+' 格 · 启动资金 ¥'+x.cash+' · 最多 '+x.maxPlayers+' 人</p><p>作者：'+(localStorage.getItem('richman_name')||'Guest Player')+'</p><button class="btn" onclick="play(\''+x.id+'\')">🎮 进入世界</button></article>').join(''):'<div class="empty">这里还没有公开世界。去 World Builder 创建并发布第一张地图吧！</div>'}render('all');</script><script src="./theme.js"></script></body></html>
